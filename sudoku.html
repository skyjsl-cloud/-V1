<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스도쿠 · Sudoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1F5;
    --paper-line:#C7D2DE;
    --paper-line-soft:#DCE3EB;
    --ink:#1F2A3A;
    --ink-soft:#5B6B80;
    --box-line:#28344A;
    --accent:#C8930A;
    --accent-soft:#F1E0AE;
    --error:#B4432D;
    --error-soft:#F3D9D2;
    --success:#3F7D58;
    --success-soft:#D9E9DE;
    --card:#FBFAF7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper-line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line-soft) 1px, transparent 1px);
    background-size:24px 24px;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .wrap{
    width:100%;
    max-width:520px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:20px;
    padding-bottom:14px;
    border-bottom:2px solid var(--box-line);
  }
  h1{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:26px;
    letter-spacing:-0.5px;
    margin:0;
  }
  h1 span{color:var(--accent);}
  .subtitle{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:4px;
    font-family:'Space Mono', monospace;
  }
  .stats{
    display:flex;
    gap:18px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
    font-family:'Space Mono', monospace;
    font-size:13px;
  }
  .stat{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .stat-label{
    color:var(--ink-soft);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .stat-value{
    font-size:16px;
    font-weight:700;
  }
  .stat-value.error{color:var(--error);}

  .difficulty-row{
    display:flex;
    gap:6px;
  }
  .diff-btn{
    font-family:'Space Mono', monospace;
    font-size:11px;
    padding:6px 10px;
    border:1.5px solid var(--box-line);
    background:var(--card);
    color:var(--ink);
    border-radius:4px;
    cursor:pointer;
    transition:all .15s;
  }
  .diff-btn:hover{border-color:var(--accent);}
  .diff-btn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }

  .board-shell{
    background:var(--card);
    border:2px solid var(--box-line);
    border-radius:6px;
    padding:10px;
    position:relative;
  }
  .board{
    display:grid;
    grid-template-columns:repeat(9, 1fr);
    grid-template-rows:repeat(9, 1fr);
    width:100%;
    aspect-ratio:1/1;
    background:var(--box-line);
    gap:1px;
    border:2px solid var(--box-line);
  }
  .cell{
    background:var(--card);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Mono', monospace;
    font-size:clamp(14px, 3.6vw, 22px);
    font-weight:400;
    color:var(--ink);
    cursor:pointer;
    position:relative;
    user-select:none;
  }
  .cell.given{
    font-weight:700;
    cursor:default;
  }
  .cell.selected{background:var(--accent-soft);}
  .cell.peer{background:#EDF1F6;}
  .cell.same-value{color:var(--accent);}
  .cell.error-cell{
    color:var(--error);
    background:var(--error-soft);
  }
  .cell.solved-flash{background:var(--success-soft);}

  /* thicker box borders every 3 cells */
  .cell:nth-child(3n){border-right:2px solid var(--box-line);}
  .cell:nth-child(9n+1){border-left:0;}
  .cell{border-right:1px solid var(--paper-line-soft);}
  .row-thick{border-bottom:2px solid var(--box-line) !important;}

  .notes{
    position:absolute;
    inset:0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    pointer-events:none;
  }
  .notes span{
    font-family:'Space Mono', monospace;
    font-size:9px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .controls{
    margin-top:18px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .numpad{
    display:grid;
    grid-template-columns:repeat(9, 1fr);
    gap:6px;
  }
  .num-btn{
    font-family:'Space Mono', monospace;
    font-size:16px;
    font-weight:700;
    padding:12px 0;
    border:1.5px solid var(--box-line);
    background:var(--card);
    color:var(--ink);
    border-radius:4px;
    cursor:pointer;
    transition:all .15s;
  }
  .num-btn:hover{background:var(--accent-soft); border-color:var(--accent);}
  .num-btn:active{transform:scale(0.95);}

  .action-row{
    display:flex;
    gap:8px;
  }
  .action-btn{
    flex:1;
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:600;
    padding:10px 12px;
    border:1.5px solid var(--box-line);
    background:var(--card);
    color:var(--ink);
    border-radius:4px;
    cursor:pointer;
    transition:all .15s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .action-btn:hover{border-color:var(--accent);}
  .action-btn.primary{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .action-btn.active-toggle{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--ink);
  }
  .action-btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .action-btn:disabled:hover{border-color:var(--box-line);}

  .win-banner{
    display:none;
    margin-top:14px;
    padding:14px 16px;
    background:var(--success-soft);
    border:1.5px solid var(--success);
    border-radius:6px;
    color:var(--success);
    font-family:'Space Mono', monospace;
    font-size:13px;
    text-align:center;
    font-weight:700;
  }
  .win-banner.show{display:block;}
  .win-banner.record{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:#8A6600;
  }

  footer{
    margin-top:24px;
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    font-family:'Space Mono', monospace;
  }

  @media (max-width:400px){
    .num-btn{font-size:14px; padding:10px 0;}
    .action-btn{font-size:11px; padding:9px 8px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>스도쿠<span>.</span></h1>
      <div class="subtitle">grid paper edition</div>
    </div>
    <div class="difficulty-row" id="diffRow">
      <button class="diff-btn" data-diff="easy">쉬움</button>
      <button class="diff-btn active" data-diff="medium">중급</button>
      <button class="diff-btn" data-diff="hard">어려움</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat">
      <span class="stat-label">Time</span>
      <span class="stat-value" id="timeVal">00:00</span>
    </div>
    <div class="stat">
      <span class="stat-label">Best</span>
      <span class="stat-value" id="bestVal">--:--</span>
    </div>
    <div class="stat">
      <span class="stat-label">Mistakes</span>
      <span class="stat-value" id="mistakeVal">0 / 3</span>
    </div>
    <div class="stat">
      <span class="stat-label">Given</span>
      <span class="stat-value" id="givenVal">-</span>
    </div>
  </div>

  <div class="board-shell">
    <div class="board" id="board"></div>
  </div>

  <div class="win-banner" id="winBanner">퍼즐을 완성했습니다!</div>

  <div class="controls">
    <div class="numpad" id="numpad"></div>
    <div class="action-row">
      <button class="action-btn" id="notesBtn">✎ 메모</button>
      <button class="action-btn" id="eraseBtn">지우기</button>
      <button class="action-btn" id="hintBtn">힌트 <span id="hintCount">3</span></button>
      <button class="action-btn primary" id="newGameBtn">새 게임</button>
    </div>
  </div>

  <footer>no external API · generated locally in your browser</footer>
</div>

<script src="sudoku.js"></script>
</body>
</html>
