<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하루 열 문제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{
  --bg:#EEF2F5; --grid:rgba(59,120,220,.07); --paper:#FFFFFF; --paper2:#F6F8FA;
  --ink:#1C2533; --ink2:#5A6778; --line:#D8DFE7;
  --pencil:#F2B32A; --pencil-ink:#3A2A00;
  --stamp:#D6402B;
  --kor:#E0633A; --eng:#3B78DC; --math:#1F9D68; --sci:#8A57E6;
  --ok:#1C9A57; --ok-bg:#E4F5EC; --bad:#D6402B; --bad-bg:#FCE9E6;
  --shadow:0 1px 0 rgba(28,37,51,.06),0 6px 18px -10px rgba(28,37,51,.25);
  --display:'Jua','Gowun Dodum',system-ui,sans-serif;
  --body:'Gowun Dodum',system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121820; --grid:rgba(120,160,230,.06); --paper:#1B232D; --paper2:#222C38;
    --ink:#E7EDF4; --ink2:#9AA8B9; --line:#2D3846;
    --pencil:#F4BE45; --pencil-ink:#2A1E00; --stamp:#F0644C;
    --kor:#F07E57; --eng:#6A9BF0; --math:#3FC18A; --sci:#A884F2;
    --ok:#46C987; --ok-bg:#16301F; --bad:#F0644C; --bad-bg:#3A1C18;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121820; --grid:rgba(120,160,230,.06); --paper:#1B232D; --paper2:#222C38;
  --ink:#E7EDF4; --ink2:#9AA8B9; --line:#2D3846;
  --pencil:#F4BE45; --pencil-ink:#2A1E00; --stamp:#F0644C;
  --kor:#F07E57; --eng:#6A9BF0; --math:#3FC18A; --sci:#A884F2;
  --ok:#46C987; --ok-bg:#16301F; --bad:#F0644C; --bad-bg:#3A1C18;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; font-family:var(--body); color:var(--ink); font-size:16px; line-height:1.6;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 110px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top .in{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:24px;letter-spacing:-.5px;line-height:1;position:relative;padding-bottom:4px}
.brand::after{content:"";position:absolute;left:0;right:30%;bottom:0;height:6px;background:var(--pencil);border-radius:3px;opacity:.75;z-index:-1}
.gradechip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.gradechip b{font-family:var(--display);font-weight:400;font-size:15px}

/* cards */
.stack{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.card h3{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 10px}
.eyebrow{font-size:13px;color:var(--ink2);letter-spacing:.02em}
.muted{color:var(--ink2)}
.small{font-size:13px}

.today .count{font-family:var(--display);display:flex;align-items:baseline;gap:6px;margin:6px 0 12px}
.today .count b{font-size:56px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.today .count span{font-size:22px;color:var(--ink2)}
.segbar{display:flex;gap:4px;margin:4px 0 10px}
.seg{flex:1;height:10px;border-radius:5px;background:var(--line);position:relative}
.seg.ok{background:var(--c)}
.seg.no{background:repeating-linear-gradient(135deg,var(--bad) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1.5px var(--bad)}
.seg.cur{outline:2px solid var(--ink);outline-offset:1px}
.mix{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:var(--ink2);margin-bottom:14px}
.mix i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}

.btn{border:0;border-radius:14px;padding:14px 18px;font-family:var(--display);font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--pencil);color:var(--pencil-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--pencil) 60%,#000)}
.btn.line{background:var(--paper);border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn.sm{font-size:15px;padding:9px 14px;border-radius:11px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--ink2)}
.dot{width:38px;height:38px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-size:11px;line-height:1.05;color:transparent}
.dot.done{border:2px solid var(--stamp);color:var(--stamp);transform:rotate(-12deg);background:color-mix(in srgb,var(--stamp) 8%,transparent)}
.dot.today{border-color:var(--ink2)}
.day.is-today span{color:var(--ink);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:12px;color:var(--ink2)}

.formula-of-day .ftitle{font-family:var(--display);font-size:17px;margin-bottom:6px}

/* subject tag */
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:14px;padding:3px 10px;border-radius:8px;color:#fff;background:var(--c)}
.band{font-size:13px;color:var(--ink2);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.s-kor{--c:var(--kor)} .s-eng{--c:var(--eng)} .s-math{--c:var(--math)} .s-sci{--c:var(--sci)}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;margin:6px 0 6px}
.ghost{background:none;border:0;padding:8px 4px;color:var(--ink2);font-size:15px}
.qpos{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);border-top:6px solid var(--c)}
.qmeta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.qtext{font-size:19px;line-height:1.65;margin-bottom:16px;word-break:keep-all}
.expr{font-size:24px;text-align:center;margin:12px 0 4px;letter-spacing:.02em;line-height:1.8}
.choices{display:flex;flex-direction:column;gap:9px}
.ch{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:var(--paper2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.5;min-height:52px;word-break:keep-all}
.ch .n{font-family:var(--display);font-size:19px;color:var(--ink2);flex:none;width:22px}
.ch:hover:not([disabled]){border-color:var(--c)}
.ch.ok{background:var(--ok-bg);border-color:var(--ok)}
.ch.ok .n{color:var(--ok)}
.ch.bad{background:var(--bad-bg);border-color:var(--bad)}
.ch.bad .n{color:var(--bad)}
.ch.dim{opacity:.55}
.ch[disabled]{cursor:default}
.hintbox{margin-top:12px;background:color-mix(in srgb,var(--pencil) 16%,var(--paper));border:1.5px dashed var(--pencil);border-radius:12px;padding:10px 14px;font-size:15px}
.hintbox b{font-family:var(--display);font-weight:400;margin-right:6px}
.verdict{margin-top:16px;font-family:var(--display);font-size:22px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.explain{margin-top:8px;background:var(--paper2);border-radius:12px;padding:12px 14px}
.explain h4{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:16px}
.explain ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.explain li{line-height:1.6}
.mini{margin-top:10px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}
.mini .mt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.mini .mt b{font-family:var(--display);font-weight:400;font-size:16px}
.linkbtn{background:none;border:0;color:var(--eng);font-size:14px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.qactions{display:flex;gap:10px;margin-top:14px}
.qactions .btn{flex:1}

/* formula box */
.fbox{background:var(--paper2);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px;font-size:16px;line-height:1.9;overflow-x:auto}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.15;margin:0 .12em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.rad{border-top:1.5px solid currentColor;padding:0 .08em;margin-left:.02em}

/* result */
.result{text-align:center}
.stampbig{width:150px;height:150px;margin:8px auto 4px;border-radius:50%;border:5px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-family:var(--display);font-size:26px;line-height:1.15;transform:rotate(-14deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both;background:color-mix(in srgb,var(--stamp) 6%,transparent)}
.stampbig span{padding:0 14px}
@keyframes stamp{from{transform:rotate(-14deg) scale(1.8);opacity:.2}to{transform:rotate(-14deg) scale(1);opacity:1}}
.score{font-family:var(--display);font-size:40px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.bysub{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}
.bysub div{background:var(--paper2);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;font-size:15px}

/* book */
.search{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.tabs button{border:1.5px solid var(--line);background:var(--paper);border-radius:11px;padding:9px 4px;font-family:var(--display);font-size:16px}
.tabs button.on{background:var(--c);border-color:var(--c);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:14px}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.concept{scroll-margin-top:80px}
.concept.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--pencil)}100%{box-shadow:var(--shadow)}}
.concept .ch-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.concept .ch-head h3{margin:0}
.concept p{margin:10px 0 0;word-break:keep-all}
.ex{margin-top:8px;font-size:15px;color:var(--ink2)}
.ex b{color:var(--ink);font-weight:700;margin-right:4px}
.empty{text-align:center;color:var(--ink2);padding:30px 10px}

/* note */
.note .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--ink2);position:relative}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--ink)}
.nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--pencil)}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:#fff;font-size:11px;border-radius:999px;padding:0 6px;line-height:17px;font-variant-numeric:tabular-nums}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,22,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.sheet h2{font-family:var(--display);font-weight:400;margin:0 0 4px;font-size:22px}
.opt{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:10px 0 18px}
.opt button{border:1.5px solid var(--line);background:var(--paper2);border-radius:12px;padding:12px 6px;font-size:15px}
.opt button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.label{font-family:var(--display);font-size:16px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* 모의고사 */
.exhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);margin-top:6px}
.exhead .t{font-family:var(--display);font-size:16px}
.timer{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.low{color:var(--bad)}
.omr{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.omr button{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);font-size:12px;padding:0;font-variant-numeric:tabular-nums;min-width:0}
.omr button.done{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.omr button.cur{outline:2.5px solid var(--pencil);outline-offset:1px}
.omr button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.omr button.no{background:var(--bad);border-color:var(--bad);color:#fff}
.ch.sel{background:color-mix(in srgb,var(--c) 14%,var(--paper));border-color:var(--c)}
.ch.sel .n{color:var(--c)}
.confirm{margin-top:12px;border:2px solid var(--bad);border-radius:14px;padding:14px;background:var(--bad-bg)}
.confirm p{margin:0 0 10px}
.subjpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:10px 0 16px}
.subjpick button{border:1.5px solid var(--line);background:var(--paper2);border-radius:12px;padding:14px 8px;font-family:var(--display);font-size:17px;display:flex;flex-direction:column;align-items:center;gap:2px}
.subjpick button small{font-family:var(--body);font-size:12px;color:var(--ink2)}
.subjpick button.on{border-color:var(--c,var(--ink));background:var(--c,var(--ink));color:#fff}
.subjpick button.on small{color:rgba(255,255,255,.85)}
.s-all{--c:var(--ink)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.hist b{font-family:var(--display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}
details.rq{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.rq summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center}
details.rq summary::-webkit-details-marker{display:none}
details.rq summary .mk{font-family:var(--display);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;font-size:14px}
details.rq summary .mk.ok{background:var(--ok)} details.rq summary .mk.no{background:var(--bad)}
details.rq summary .sq{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
details.rq .qcard{border-radius:0;border:0;border-top:1px solid var(--line);box-shadow:none}
.tabs.two{grid-template-columns:repeat(2,1fr);margin-top:6px}
.tabs.two button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.lvtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.lvname{font-family:var(--display);font-size:22px}
.pips{display:flex;gap:5px}.pips i{width:14px;height:14px;border-radius:50%;border:2px solid var(--pencil)}.pips i.on{background:var(--pencil)}
.rec{margin-top:8px;font-size:14px}.rec b{font-family:var(--display);font-weight:400;font-size:17px}
.gamecard{padding:14px}
.gstatus{font-family:var(--display);font-size:17px;margin-bottom:8px;min-height:1.6em}
.gstatus.think{color:var(--eng)}
.gnote{background:var(--bad-bg);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:8px}
.caps{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-height:30px;font-size:22px;margin:4px 0}
.caps .muted{margin-right:6px}.caps b{font-family:var(--display);font-weight:400}
.cboard{display:grid;grid-template-columns:repeat(8,1fr);border:4px solid #6b4f33;border-radius:8px;overflow:hidden;width:100%;max-width:460px;margin:0 auto;user-select:none}
.sq{aspect-ratio:1;border:0;padding:0;display:grid;place-items:center;position:relative;font-size:clamp(24px,9vw,44px);line-height:1;min-width:0}
.sq.l{background:#EFD9B4}.sq.d{background:#B5875F}
.sq.last{box-shadow:inset 0 0 0 100px rgba(242,179,42,.38)}
.sq.sel{box-shadow:inset 0 0 0 4px #F2B32A}
.sq.chk{background:radial-gradient(circle,#E24A33 0 38%,transparent 72%),#EFD9B4}
.sq.d.chk{background:radial-gradient(circle,#E24A33 0 38%,transparent 72%),#B5875F}
.sq.tcap{box-shadow:inset 0 0 0 4px rgba(214,64,43,.75)}
.sq .dot{position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(30,40,50,.38)}
.sq em{position:absolute;font-style:normal;font-size:10px;line-height:1;color:rgba(40,28,15,.6);font-family:var(--body)}
.sq .rk{left:3px;top:3px}.sq .fl{right:3px;bottom:2px}
.pc{display:block}.pc.pw{color:#fff;text-shadow:0 0 1px #000,0 0 1px #000,0 1px 2px rgba(0,0,0,.6)}.pc.pb{color:#1b1b1b;text-shadow:0 0 1px rgba(255,255,255,.35)}
.caps .pc{display:inline;font-size:22px}
.goboard{display:block;width:100%;max-width:460px;height:auto;margin:0 auto}
.gohit{cursor:pointer}
.gresult{margin-top:12px;border-radius:14px;padding:14px;background:var(--paper2);border:2px solid var(--line);text-align:center}
.gresult.win{border-color:var(--ok);background:var(--ok-bg)}.gresult.loss{border-color:var(--bad);background:var(--bad-bg)}
.gresult b{font-family:var(--display);font-weight:400;font-size:24px}
.gresult p{margin:6px 0 12px}
.nav button{font-size:12px}
.coach{margin-top:12px;border:2px solid var(--eng);border-radius:14px;padding:10px 14px;background:color-mix(in srgb,var(--eng) 8%,var(--paper))}
.coach-h{font-family:var(--display);font-size:15px;color:var(--eng);margin-bottom:2px}
.coach p{margin:4px 0;font-size:15px;line-height:1.55}
.lessonnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.lessonnav button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper2);font-family:var(--display);font-size:15px;padding:0}
.lessonnav button.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.lessonnav button.on{outline:3px solid var(--pencil);outline-offset:1px}
.lx{margin:0 0 10px;word-break:keep-all}
.lq{background:color-mix(in srgb,var(--pencil) 16%,var(--paper));border:1.5px dashed var(--pencil);border-radius:12px;padding:10px 12px;margin-bottom:10px;word-break:keep-all}
.lq.ok{background:var(--ok-bg);border:1.5px solid var(--ok)}
.lq b{font-family:var(--display);font-weight:400;margin-right:4px}
.band.rv{border-color:var(--pencil);background:color-mix(in srgb,var(--pencil) 18%,var(--paper));color:var(--ink)}
.rvline{font-size:14px;margin:-4px 0 14px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--pencil) 12%,var(--paper))}
.rvline b{font-family:var(--display);font-weight:400;margin-right:6px}
/* 공유 카드 */
.sharecard{border:2px solid var(--ink);border-radius:16px;padding:16px 18px;background:var(--paper2);text-align:left;position:relative;overflow:hidden}
.sharecard .who{font-size:14px;color:var(--ink2)}
.sharecard .headline{font-family:var(--display);font-size:24px;line-height:1.3;margin:4px 0 10px}
.sharecard .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sharecard .facts div{background:var(--paper);border-radius:10px;padding:8px;text-align:center}
.sharecard .facts b{display:block;font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.sharecard .facts span{font-size:12px;color:var(--ink2)}
.sharecard .mini-stamp{position:absolute;right:12px;top:10px;width:58px;height:58px;border:2.5px solid var(--stamp);color:var(--stamp);border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:12px;line-height:1.1;text-align:center;transform:rotate(-12deg)}
.sharetext{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:14px;background:var(--paper);color:var(--ink);margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.txtin{width:100%;border:1.5px solid var(--line);background:var(--paper2);border-radius:12px;padding:11px 12px;font:inherit;color:var(--ink);margin:8px 0 18px}

C('m-solid','math','m1','입체도형의 부피 · 겉넓이','기둥: V = 밑넓이 × 높이\n뿔: V = {1|3} × 밑넓이 × 높이\n구: V = {4|3}πr³,  겉넓이 = 4πr²','뿔은 같은 밑면·높이의 기둥의 {1|3}이에요.','반지름 3인 구 → V = 36π');
C('m-stat','math','m1','대푯값','평균 = 합 ÷ 개수\n중앙값 = 크기 순으로 가운데 값\n최빈값 = 가장 많이 나온 값','자료가 짝수 개면 가운데 두 값의 평균이 중앙값이에요.','2, 4, 6, 8 → 중앙값 (4 + 6) ÷ 2 = 5');
C('m-rep','math','m2','순환소수를 분수로','0.ȧ = {a|9},  0.ȧḃ = {ab|99}\n0.aḃ = {ab − a|90}','순환마디 자리 수만큼 9, 소수점 아래 순환하지 않는 자리 수만큼 0을 붙여요.','0.333… = {3|9} = {1|3}');
C('m-exp','math','m2','지수법칙','aᵐ × aⁿ = aᵐ⁺ⁿ\n(aᵐ)ⁿ = aᵐⁿ\naᵐ ÷ aⁿ = aᵐ⁻ⁿ (m > n)\n(ab)ⁿ = aⁿbⁿ','곱셈은 지수 더하기, 거듭제곱의 거듭제곱은 지수 곱하기!','x³ × x⁴ = x⁷,  (x²)³ = x⁶');
C('m-sys','math','m2','연립방정식','가감법: 두 식을 더하거나 빼서 한 문자 없애기\n대입법: 한 식을 x = … 꼴로 바꿔 다른 식에 넣기','계수가 같거나 반대면 가감법, 한 문자가 혼자 있으면 대입법이 편해요.','x + y = 5, x − y = 1 → 더하면 2x = 6 → x = 3, y = 2');
C('m-ineq','math','m2','일차부등식','양변에 음수를 곱하거나 나누면\n부등호 방향이 바뀐다','나머지는 방정식 풀이와 똑같아요.','−2x < 6 → x > −3');
C('m-linfn','math','m2','일차함수','y = ax + b\n기울기 a = {y의 증가량|x의 증가량}\ny절편 = b,  x절편 = −{b|a}','a > 0이면 오른쪽 위로, a < 0이면 오른쪽 아래로 향하는 직선이에요.','(1, 3), (3, 7) → 기울기 {4|2} = 2');
C('m-isos','math','m2','이등변삼각형 · 외심 · 내심','이등변삼각형: 두 밑각의 크기가 같다\n외심: 세 꼭짓점까지 거리가 같다\n내심: 세 변까지 거리가 같다','외심은 세 변의 수직이등분선, 내심은 세 내각의 이등분선이 만나는 점.','직각삼각형의 외심 = 빗변의 중점');
C('m-sim','math','m2','닮음','닮음비 m : n\n→ 넓이의 비 m² : n²\n→ 부피의 비 m³ : n³','닮은 도형은 대응변의 길이 비가 일정하고 대응각의 크기가 같아요.','닮음비 1 : 2 → 넓이 1 : 4, 부피 1 : 8');
C('m-prob','math','m2','경우의 수와 확률','확률 = {사건이 일어나는 경우의 수|모든 경우의 수}\n동시에(그리고) → 곱하기\n또는 → 더하기','확률은 항상 0 이상 1 이하. (어떤 일이 일어나지 않을 확률) = 1 − p','주사위 2개 합이 7 → {6|36} = {1|6}');
C('m-sqrt','math','m3','제곱근의 성질','(√a)² = a,  √(a²) = |a|\n√a × √b = √(ab)\n√(a²b) = a√b  (a > 0)','근호 안의 제곱수는 밖으로 꺼낼 수 있어요.','√12 = √(4×3) = 2√3');
C('m-ration','math','m3','분모의 유리화','{a|√b} = {a√b|b}','분모에 근호가 있으면 분자·분모에 같은 √b를 곱해요.','{1|√2} = {√2|2}');
C('m-mulf','math','m3','곱셈 공식과 인수분해','(a + b)² = a² + 2ab + b²\n(a − b)² = a² − 2ab + b²\n(a + b)(a − b) = a² − b²\n(x + a)(x + b) = x² + (a + b)x + ab','인수분해는 곱셈 공식을 거꾸로! "곱해서 끝 수, 더해서 가운데 수"인 두 수를 찾아요.','x² + 5x + 6 = (x + 2)(x + 3)');
C('m-quad','math','m3','이차방정식 · 근의 공식','ax² + bx + c = 0\nx = {−b ± √(b² − 4ac)|2a}','판별식 b² − 4ac > 0 → 근 2개, = 0 → 중근, < 0 → 근 없음. 인수분해가 되면 인수분해가 더 빨라요.','x² − 5x + 6 = 0 → x = 2 또는 3');
C('m-qfn','math','m3','이차함수','y = a(x − p)² + q\n꼭짓점 (p, q),  축 x = p','a > 0이면 아래로 볼록, a < 0이면 위로 볼록. |a|가 클수록 폭이 좁아요.','y = 2(x − 3)² + 1 → 꼭짓점 (3, 1)');
C('m-pyth','math','m3','피타고라스 정리','직각삼각형에서\na² + b² = c²  (c는 빗변)','자주 나오는 세 수: (3, 4, 5), (5, 12, 13), (8, 15, 17)','3² + 4² = 9 + 16 = 25 = 5²');
C('m-trig','math','m3','삼각비','sin A = {높이|빗변},  cos A = {밑변|빗변},  tan A = {높이|밑변}\nsin30° = {1|2}, cos30° = {√3|2}, tan45° = 1','30°·60°·90° 삼각형의 변의 비 1 : √3 : 2, 45° 삼각형은 1 : 1 : √2','sin60° = {√3|2}');
C('m-circ','math','m3','원주각','원주각 = 중심각 × {1|2}\n지름에 대한 원주각 = 90°','같은 호에 대한 원주각의 크기는 모두 같아요.','중심각 100° → 원주각 50°');
/* 영어 */
C('e-be','eng','e56','be동사','I am / You·We·They are / He·She·It is\n과거: was (am, is),  were (are)','부정은 뒤에 not(isn\'t, aren\'t), 의문문은 be동사를 앞으로(Are you ~?).','I am happy. / They were at school.');
C('e-3s','eng','e56','3인칭 단수 현재형','He/She/It + 동사-s\n-es: s, x, sh, ch, o로 끝나면 (watches, goes)\n자음+y → -ies (studies),  have → has','부정문은 doesn\'t + 동사원형, 의문문은 Does ~ + 동사원형?','She plays the piano. / Does he like cats?');
C('e-plural','eng','e56','명사의 복수형','대부분 -s (books)\n-es (boxes, dishes),  자음+y → -ies (babies)\nf/fe → -ves (leaves, knives)\n불규칙: child → children, man → men, tooth → teeth, mouse → mice','sheep, fish처럼 단수와 복수가 같은 단어도 있어요.','two boxes, three children');
C('e-past','eng','e56','과거시제','규칙: 동사 + -ed (played, studied, stopped)\n불규칙: go-went, eat-ate, see-saw, have-had, come-came, make-made','부정문은 didn\'t + 동사원형, 의문문은 Did ~ + 동사원형?','I went to the zoo yesterday.');
C('e-can','eng','e56','조동사 can','can + 동사원형 = ~할 수 있다\n부정: can\'t,  Can I ~? = ~해도 될까요?','조동사 뒤에는 항상 동사원형!','I can swim. / Can I go now?');
C('e-prog','eng','m1','현재진행형','be동사 + 동사-ing = ~하고 있다\nmake → making,  run → running,  lie → lying','now, right now, Look! 과 자주 함께 써요.','She is reading a book now.');
C('e-wh','eng','m1','의문사','who 누구 / what 무엇 / when 언제\nwhere 어디 / why 왜 / how 어떻게\nhow many(수) / how much(양·값) / how old(나이)','의문사 의문문: 의문사 + be동사/do + 주어 ~?','Where do you live? / How many books do you have?');
C('e-future','eng','m1','미래 표현','will + 동사원형\nbe going to + 동사원형','will은 즉석 결정·예측, be going to는 이미 정한 계획에 자주 써요.','I will call you. / I am going to visit Jeju.');
C('e-comp','eng','m1','비교급과 최상급','tall - taller - tallest\nbig - bigger - biggest,  happy - happier - happiest\nbeautiful - more beautiful - most beautiful\ngood - better - best,  bad - worse - worst','비교급 + than(~보다), the + 최상급 + in/of(~중에서 가장)','Tom is taller than me. / She is the smartest in her class.');
C('e-modal','eng','m1','조동사 must · should · may','must = ~해야 한다 (= have to)\nmust not = ~하면 안 된다\ndon\'t have to = ~할 필요 없다\nshould = ~하는 게 좋다,  may = ~일지도 모른다 / ~해도 된다','must not(금지)과 don\'t have to(불필요)를 꼭 구별하세요.','You must not run here. / You don\'t have to hurry.');
C('e-imp','eng','m1','명령문 · There is/are','명령문: 동사원형 ~  /  부정: Don\'t + 동사원형\nLet\'s + 동사원형 = ~하자\nThere is + 단수,  There are + 복수','be동사 명령문은 Be ~ (Be quiet!).','Don\'t be late. / There are two cats.');
C('e-pp','eng','m2','현재완료','have/has + 과거분사(p.p.)\n경험: ever, never, ~ times\n계속: for(기간), since(시점)\n완료: just, already, yet\n결과: have lost → 지금도 없음','yesterday, ago, last ~ 처럼 명확한 과거 표현과는 함께 못 써요.','I have lived here for 5 years.');
C('e-inf','eng','m2','to부정사','to + 동사원형\n명사적: ~하는 것 (I want to be…)\n형용사적: ~할 (something to eat)\n부사적: ~하기 위해 (to meet her)','가주어 It: It is fun to play soccer.','I went to the library to study.');
C('e-ger','eng','m2','동명사 vs to부정사','동명사만: enjoy, finish, mind, avoid, give up + -ing\nto부정사만: want, hope, plan, decide + to ~\n둘 다: like, love, start, begin','전치사 뒤에는 항상 동명사! (be good at playing)','I finished doing my homework.');
C('e-passive','eng','m2','수동태','be동사 + 과거분사 (+ by 행위자)\n능동: Tom broke the window.\n수동: The window was broken by Tom.','시제는 be동사로 나타내요: is/are(현재), was/were(과거), will be(미래).','This book was written by her.');
C('e-5','eng','m2','문장의 5형식','1형식 S + V\n2형식 S + V + C\n3형식 S + V + O\n4형식 S + V + IO(~에게) + DO(~을)\n5형식 S + V + O + OC','4형식 → 3형식: give/send/show/tell + to, buy/make/cook + for, ask + of','He gave me a book. = He gave a book to me.');
C('e-conj','eng','m2','접속사','when ~할 때 / because ~때문에\nif 만약 ~라면 / that ~라는 것\nbefore, after, while, although','시간·조건 부사절(when, if)에서는 미래 대신 현재시제!','If it rains tomorrow, I will stay home.');
C('e-rel','eng','m3','관계대명사','사람: who(주격), whom(목적격), whose(소유격)\n사물·동물: which\n둘 다: that\nwhat = the thing(s) which (선행사 포함)','목적격 관계대명사는 생략할 수 있어요.','The boy who is running is my brother. / This is what I need.');
C('e-reladv','eng','m3','관계부사','시간 when / 장소 where / 이유 why / 방법 how\n관계부사 = 전치사 + which','the way와 how는 함께 쓰지 않아요 (둘 중 하나만).','This is the place where I met her.');
C('e-subj','eng','m3','가정법 과거','If + 주어 + 과거동사(be는 were),\n주어 + would/could + 동사원형','현재 사실과 반대되는 상상. 모양은 과거지만 뜻은 현재예요.','If I had wings, I could fly.');
C('e-part','eng','m3','현재분사 · 과거분사','현재분사 -ing: 능동·진행 (a sleeping baby)\n과거분사 p.p.: 수동·완료 (a broken window)\n감정: boring(지루하게 하는) / bored(지루함을 느끼는)','분사가 혼자면 명사 앞, 다른 말과 함께면 명사 뒤에서 꾸며요.','The girl dancing on the stage is Mina.');
C('e-indq','eng','m3','간접의문문','의문사 + 주어 + 동사\nDo you know where he lives?\n의문사가 없으면 if/whether + 주어 + 동사','think, believe 등이 있으면 의문사를 맨 앞으로: What do you think he wants?','I wonder if she likes me.');
C('e-sothat','eng','m3','so ~ that / too ~ to','so + 형용사/부사 + that + 주어 + 동사 = 너무 ~해서 …하다\ntoo + 형용사 + to 동사원형 = 너무 ~해서 …할 수 없다','too ~ to = so ~ that + 주어 + can\'t','He is too young to drive. = He is so young that he can\'t drive.');
C('e-pcl','eng','m3','분사구문','접속사와 (같은) 주어를 빼고 동사를 -ing로\nWhen I saw him → Seeing him','수동이면 Being + p.p.에서 Being을 생략할 수 있어요.','Walking along the street, I met Tom.');
/* 국어 */
C('k-honor','kor','e56','높임법','주체 높임: -(으)시-, 께서 (선생님께서 오신다)\n객체 높임: 드리다, 여쭙다, 모시다, 께\n상대 높임: -습니다, -요\n특수 어휘: 밥→진지, 집→댁, 있다→계시다, 자다→주무시다','높일 사람이 누구인지 먼저 찾아요.','할머니께 선물을 드렸다.');
C('k-fig','kor','e56','비유법과 표현 방법','직유법: ~처럼, ~같이 (솜사탕처럼 부드러운)\n은유법: A는 B이다 (내 동생은 꼬마 요리사다)\n의인법: 사람처럼 (바람이 속삭인다)\n과장법, 반복법, 대구법, 설의법','비유는 "원관념(진짜 대상)"과 "보조 관념(빗댄 대상)"으로 이루어져요.','"시간은 금이다" → 원관념: 시간, 보조 관념: 금');
C('k-space','kor','e56','띄어쓰기 기본','낱말은 띄어 쓴다\n조사는 앞말에 붙인다 (나는, 학교에서)\n의존 명사는 띄어 쓴다 (할 수 있다, 먹을 것, 온 지 3일)\n단위 명사는 띄어 쓴다 (사과 한 개)','"-ㄴ지"(어미)와 "지"(의존 명사, 시간)를 구별해요: 갔는지 몰라 / 간 지 1년','책을 읽을 수 있다.');
C('k-spell','kor','e56','헷갈리는 맞춤법','왠지(왜인지) / 웬일, 웬만하면\n며칠 (몇일 ✕)\n어떡해(어떻게 해) / 어떻게\n안(아니) + 동사 / -지 않다\n돼(되어) / 되고, 되니','"되/돼"는 "하/해"를 넣어 보세요: 하요(✕)→해요 → 돼요','숙제를 안 했다. / 숙제를 하지 않았다.');
C('k-essay','kor','e56','논설문과 토론','논설문: 서론(문제·주장) → 본론(근거) → 결론(요약·강조)\n토론: 주장 펼치기 → 반론하기 → 주장 다지기','좋은 근거는 주장과 관련 있고, 믿을 만하고, 사실에 바탕을 둬요.','주장: 학교에 식물을 기르자 / 근거: 공기가 맑아진다');
C('k-prov','kor','e56','속담과 관용 표현','가랑비에 옷 젖는 줄 모른다 → 작은 것도 쌓이면 크다\n발 없는 말이 천 리 간다 → 말은 금방 퍼진다\n관용 표현: 발이 넓다(아는 사람이 많다), 손이 크다(씀씀이가 크다)','관용 표현은 낱말 뜻을 그대로 더한 뜻이 아니라 새로운 뜻을 가져요.','그 친구는 발이 넓어서 모르는 사람이 없어.');
C('k-pos','kor','m1','품사 9가지','체언: 명사, 대명사, 수사\n용언: 동사, 형용사\n수식언: 관형사, 부사\n관계언: 조사\n독립언: 감탄사','동사 vs 형용사: "-는다/-ㄴ다", "-아라/-어라"가 자연스러우면 동사!','달린다(O) → 동사 / 예쁜다(✕) → 형용사');
C('k-phon','kor','m1','자음 체계','파열음: ㄱㄷㅂ ㄲㄸㅃ ㅋㅌㅍ\n파찰음: ㅈㅉㅊ\n마찰음: ㅅㅆㅎ\n비음: ㄴㅁㅇ,  유음: ㄹ\n예사소리 → 된소리 → 거센소리 (ㄱ → ㄲ → ㅋ)','소리 나는 자리: 입술(ㅂ,ㅁ), 잇몸(ㄷ,ㄴ,ㄹ,ㅅ), 센입천장(ㅈ), 여린입천장(ㄱ,ㅇ), 목청(ㅎ)','"불, 뿔, 풀"은 세기만 다른 말이에요.');
C('k-poem','kor','m1','시의 운율과 심상','운율: 같은 소리·낱말·구절 반복, 글자 수 반복(3·4조, 7·5조)\n심상: 시각, 청각, 후각, 미각, 촉각, 공감각','공감각적 심상은 한 감각을 다른 감각으로 옮긴 것이에요 (푸른 종소리 → 청각의 시각화).','"하얀 눈이 사각사각" → 시각 + 청각');
C('k-pov','kor','m1','소설의 시점','1인칭 주인공 시점: "나" = 주인공\n1인칭 관찰자 시점: "나"가 주인공을 관찰\n3인칭 관찰자 시점: 밖에서 행동만 보여 줌\n전지적 작가 시점: 인물 속마음까지 다 앎','시점을 알면 "누구의 눈으로 이야기를 보는지" 알 수 있어요.','"그는 속으로 몹시 서운했다" → 전지적 작가 시점');
C('k-comp','kor','m2','문장 성분','주성분: 주어, 서술어, 목적어, 보어\n부속 성분: 관형어, 부사어\n독립 성분: 독립어','보어는 "되다, 아니다" 앞에 오는 "~이/가"예요.','물이 얼음이 되었다 → "얼음이"는 보어');
C('k-change','kor','m2','음운 변동','비음화: 국물[궁물], 밥물[밤물]\n유음화: 신라[실라], 칼날[칼랄]\n구개음화: 굳이[구지], 같이[가치]\n된소리되기: 국밥[국빱]\n거센소리되기: 좋고[조코]','발음을 편하게 하려고 소리가 바뀌는 현상이에요. 표기는 그대로!','입는[임는] → 비음화');
C('k-explain','kor','m2','설명 방법','정의: A는 B이다\n예시: 예를 들어\n비교(공통점) / 대조(차이점)\n분류(기준으로 나누기) / 분석(부분으로 나누기)\n인과(원인과 결과)','분류는 "종류", 분석은 "구성 요소"로 나눠요.','꽃은 꽃잎, 암술, 수술, 꽃받침으로 이루어진다 → 분석');
C('k-argue','kor','m2','논증 방법','연역: 일반 원리 → 구체적 결론 (삼단 논법)\n귀납: 여러 사례 → 일반 결론\n유추: 비슷한 점을 근거로 추리','귀납은 사례가 충분하고 대표성이 있어야 믿을 만해요.','사람은 죽는다 → 소크라테스는 사람이다 → 소크라테스는 죽는다 (연역)');
C('k-irony','kor','m2','반어와 역설','반어: 속뜻과 반대로 말하기 (시험 망친 친구에게 "참 잘했다")\n역설: 겉으로는 모순이지만 진리를 담기 (지는 것이 이기는 것이다)','반어는 "상황"과 말이 반대, 역설은 "말 자체"가 모순이에요.','"바쁠수록 돌아가라" → 역설');
C('k-sent','kor','m3','문장의 짜임','홑문장: 주어-서술어 한 번\n이어진문장: 대등(-고, -지만) / 종속(-면, -아서, -려고)\n안은문장: 명사절, 관형절, 부사절, 서술절, 인용절','안긴문장은 문장 속 문장, 이어진문장은 문장과 문장을 나란히 연결한 것이에요.','코끼리는 코가 길다 → 서술절을 안은문장');
C('k-voice','kor','m3','피동과 사동','피동(당함): -이-, -히-, -리-, -기-, -되다, -어지다 (잡히다, 열리다)\n사동(시킴): -이-, -히-, -리-, -기-, -우-, -구-, -추-, -게 하다 (먹이다, 입히다, 깨우다)','같은 접사라도 뜻을 보고 판단해요: 아기가 엄마에게 안기다(피동) / 엄마가 아기를 안기다(사동)','쥐가 잡혔다(피동) / 아이에게 밥을 먹였다(사동)');
C('k-quote','kor','m3','인용 표현','직접 인용: "…"라고 / 하고\n간접 인용: …고 (말했다, 했다)','간접 인용을 할 때는 높임, 시간, 지시 표현도 말하는 사람 입장에서 바꿔요.','"내일 가자."라고 했다 → 다음 날 가자고 했다');
C('k-hangul','kor','m3','훈민정음 창제 원리','자음: 발음 기관 모양 → 기본자 ㄱ ㄴ ㅁ ㅅ ㅇ\n→ 가획: ㅋ / ㄷ ㅌ / ㅂ ㅍ / ㅈ ㅊ / ㆆ ㅎ\n→ 이체자: ㆁ ㄹ ㅿ\n모음: 하늘(·), 땅(ㅡ), 사람(ㅣ) 상형 → 합성','소리가 세질수록 획을 더했어요 (ㄴ → ㄷ → ㅌ).','ㄱ: 혀뿌리가 목구멍을 막는 모양');
/* 과학 */
C('s-photo','sci','e56','광합성','빛 + 물 + 이산화 탄소 → 양분(녹말) + 산소','잎의 엽록체에서 일어나요. 녹말 확인: 아이오딘 용액 → 청람색','낮에 잎을 따서 아이오딘 용액을 떨어뜨리면 청람색');
C('s-acid','sci','e56','산성과 염기성','산성: 푸른 리트머스 → 붉게, 페놀프탈레인 무색\n염기성: 붉은 리트머스 → 푸르게, 페놀프탈레인 붉게\nBTB: 산성 노랑, 중성 초록, 염기성 파랑','산성 예: 식초, 레몬즙, 탄산수 / 염기성 예: 비눗물, 석회수, 암모니아수','산성에 염기성을 넣으면 성질이 약해져요(중화).');
C('s-solar','sci','m1','태양계','수성 - 금성 - 지구 - 화성 - 목성 - 토성 - 천왕성 - 해왕성\n가장 큼: 목성,  가장 작음: 수성','태양은 스스로 빛을 내는 별(항성), 행성은 태양 빛을 반사해요.','토성은 뚜렷한 고리로 유명해요.');
C('s-circuit','sci','e56','전기 회로와 전자석','직렬: 전구 더 어둡고, 하나 빼면 모두 꺼짐\n병렬: 밝기 유지, 하나 빼도 켜짐\n전자석: 전류가 흐를 때만 자석, 감은 수↑ 세기↑','집 안의 전기 기구는 병렬로 연결되어 있어요.','전지를 반대로 연결하면 전자석의 극이 바뀌어요.');
C('s-burn','sci','e56','연소와 소화','연소 조건: 탈 물질 + 산소 + 발화점 이상의 온도\n소화: 세 조건 중 하나 이상 없애기\n연소 후 생기는 것: 물, 이산화 탄소','모래 덮기 → 산소 차단, 물 뿌리기 → 온도 낮추기','촛불에 컵을 덮으면 산소가 없어 꺼져요.');
C('s-season','sci','e56','계절 변화','지구 자전축이 약 23.5° 기울어진 채 공전\n→ 태양의 남중 고도·낮의 길이 변화','여름: 남중 고도 높음, 낮 김, 기온 높음','자전축이 기울지 않았다면 계절 변화가 없어요.');
C('s-force','sci','m1','여러 가지 힘','단위: N(뉴턴)\n중력: 지구 중심 방향, 무게 = 9.8 × 질량\n탄성력: 변형된 반대 방향\n마찰력: 운동 반대 방향,  부력: 위쪽','질량은 어디서나 같지만 무게는 장소에 따라 달라요 (달에서 약 {1|6}).','질량 10 kg → 무게 98 N');
C('s-class','sci','m1','생물의 분류','종 < 속 < 과 < 목 < 강 < 문 < 계 < 역\n5계: 원핵생물, 원생생물, 균, 식물, 동물','종: 자연 상태에서 짝짓기해 번식 가능한 자손을 낳는 무리','말과 당나귀의 자손 노새는 번식을 못 해서 다른 종이에요.');
C('s-gas','sci','m1','기체의 압력·온도·부피','보일 법칙: 온도 일정 → 압력 × 부피 = 일정\n샤를 법칙: 압력 일정 → 온도↑ 부피↑','기체 입자는 끊임없이 움직이며 벽에 부딪혀 압력을 만들어요.','높은 산에 올라가면 과자 봉지가 부풀어요 (압력↓ 부피↑).');
C('s-light','sci','m2','빛과 파동','빛의 삼원색: 빨강, 초록, 파랑 → 합치면 흰색\n반사: 입사각 = 반사각\n파동: 진폭(크기), 진동수(높낮이), 파장','소리가 클수록 진폭이 크고, 높을수록 진동수가 커요.','볼록 렌즈는 빛을 모으고, 오목 렌즈는 퍼뜨려요.');
C('s-state','sci','m1','물질의 상태 변화','융해: 고체 → 액체,  응고: 액체 → 고체\n기화: 액체 → 기체,  액화: 기체 → 액체\n승화: 고체 ↔ 기체','상태가 변해도 질량은 그대로, 입자 배열만 바뀌어요. 확산·증발은 입자 운동의 증거!','드라이아이스가 작아짐 → 승화');
C('s-mineral','sci','m2','암석과 광물','화성암: 현무암(빨리 식음, 결정 작음), 화강암(천천히, 결정 큼)\n퇴적암: 층리, 화석 (사암, 셰일, 석회암)\n변성암: 열과 압력 (편마암, 대리암)\n모스 굳기: 활석 1 … 다이아몬드 10','광물 구별: 색, 조흔색, 굳기, 자성, 염산 반응','방해석은 염산에 거품이 생겨요.');
C('s-atom','sci','m2','원자와 이온','원자 = 원자핵(양성자 +, 중성자) + 전자(−)\n전자를 잃으면 양이온, 얻으면 음이온','원자는 양성자 수 = 전자 수라서 전기적으로 중성이에요.','Na → Na⁺ (전자 1개 잃음), Cl → Cl⁻ (전자 1개 얻음)');
C('s-ohm','sci','m2','옴의 법칙','V = I × R\n전압(V) = 전류(A) × 저항(Ω)','저항이 일정하면 전압과 전류는 정비례해요.','12 V, 4 Ω → 3 A');
C('s-heat','sci','m1','열과 비열','열량 Q = c × m × Δt\n(비열 × 질량 × 온도 변화)\n열의 이동: 전도, 대류, 복사','비열이 큰 물질은 잘 데워지지도, 잘 식지도 않아요 (물, 바다).','해안에서 낮에는 해풍, 밤에는 육풍');
C('s-mass','sci','m3','질량 보존 · 일정 성분비','질량 보존: 반응 전 질량 합 = 반응 후 질량 합\n일정 성분비: 물 → 수소 : 산소 = 1 : 8 (질량비)','열린 곳에서 기체가 나가면 질량이 줄어 보이지만, 닫힌 용기에서는 같아요.','수소 2 g + 산소 16 g → 물 18 g');
C('s-digest','sci','m2','소화 효소','녹말 → 아밀레이스(침, 이자액)\n단백질 → 펩신(위액), 트립신(이자액)\n지방 → 라이페이스(이자액)\n쓸개즙: 지방을 작게 쪼갬(효소는 아님)','최종 산물: 포도당, 아미노산, 지방산 + 모노글리세리드','밥을 오래 씹으면 단맛 → 녹말이 엿당으로');
C('s-star','sci','m2','별의 밝기와 거리','등급 숫자가 작을수록 밝다\n1등급 차이 ≈ 2.5배, 5등급 차이 = 100배\n연주시차가 클수록 가까운 별','겉보기 등급: 눈에 보이는 밝기 / 절대 등급: 10 pc 거리로 옮겼을 때 밝기','1등급 별은 6등급 별보다 100배 밝다.');
C('s-motion','sci','m3','운동과 속력','속력 = 이동 거리 ÷ 걸린 시간 (m/s)\n자유 낙하: 1초마다 9.8 m/s씩 빨라짐','등속 운동은 속력이 일정, 자유 낙하는 속력이 일정하게 증가해요.','100 m를 20초 → 5 m/s');
C('s-work','sci','m3','일과 역학적 에너지','일 W = F × s (J)\n위치 에너지 = 9.8 × m × h\n운동 에너지 = {1|2} × m × v²\n역학적 에너지 = 위치 + 운동 (보존)','힘을 줘도 이동하지 않으면 과학에서 한 일은 0이에요.','10 N으로 3 m → 30 J');
C('s-cell','sci','m3','세포 분열','체세포 분열: 염색체 수 그대로, 딸세포 2개 (생장)\n감수 분열: 염색체 수 절반, 딸세포 4개 (생식세포)','사람 체세포 46개 → 생식세포 23개 → 수정란 46개','감수 분열은 연속 2회 분열해요.');
C('s-gene','sci','m3','멘델의 유전 법칙','우열의 원리: 잡종 1대에 우성만 나타남\n분리의 법칙: 잡종 2대 우성 : 열성 = 3 : 1\n독립의 법칙: 두 쌍 형질 9 : 3 : 3 : 1','대문자는 우성, 소문자는 열성 유전자예요.','Rr × Rr → RR : Rr : rr = 1 : 2 : 1');
C('s-energy','sci','m3','에너지 전환과 전력','발전기: 운동 → 전기,  전동기: 전기 → 운동\n광합성: 빛 → 화학,  전구: 전기 → 빛·열\n전력량(Wh) = 전력(W) × 시간(h)','에너지는 형태만 바뀔 뿐 전체 양은 보존돼요.','100 W 전구 3시간 → 300 Wh');
/* 초4 */
C('m-bignum','math','e4','큰 수','만 = 10000 (1000이 10개)\n억 = 1000만이 10개\n네 자리씩 끊어 읽기: 3억 8542만 6017','자리값: 일·십·백·천 → 만·십만·백만·천만 → 억. 같은 숫자라도 자리에 따라 나타내는 값이 달라요.','385,426,017에서 5는 십만의 자리 → 50만');
C('m-muldiv','math','e4','곱셈과 나눗셈','(세 자리) × (두 자리) = 일의 자리 곱 + 십의 자리 곱\n나눗셈 검산: 나누는 수 × 몫 + 나머지 = 나누어지는 수','나머지는 항상 나누는 수보다 작아야 해요.','245 ÷ 12 = 20 … 5 → 12 × 20 + 5 = 245');

/* 간격 반복 복습: 틀린 문제는 1·3·7·14·30일 뒤 다시, 30일 칸까지 맞히면 졸업 */
const IV=[1,3,7,14,30];
let SR=store.get('sr',{}),RECENT=store.get('recent',{});
function dayNum(k){const d=k?new Date(k+'T00:00:00'):new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)}
(function(){const t=dayNum();let ch=false;for(const k in RECENT)if(t-RECENT[k]>60){delete RECENT[k];ch=true}if(ch)store.set('recent',RECENT)})();
const skOf=q=>q.sk||('h'+hash(q.q+'|'+q.c[q.a]));
function srUpdate(q,ok){const k=skOf(q),t=dayNum(),e=SR[k];
  if(ok){if(!e)return;e.bx++;if(e.bx>=IV.length)delete SR[k];else e.due=t+IV[e.bx]}
  else SR[k]={bx:0,due:t+1,q:{s:q.s,b:q.b,id:q.id,q:q.q,c:q.c,a:q.a,h:q.h,e:q.e,k:q.k,sk:k}};
  store.set('sr',SR)}
function srStats(){const t=dayNum();let due=0,all=0;for(const k in SR){all++;if(SR[k].due<=t)due++}return{due,all}}
function reviewQ(r,k,v){const q=v.q,idx=shuffleR(r,q.c.map((_,i)=>i));return Object.assign({},q,{c:idx.map(i=>q.c[i]),a:idx.indexOf(q.a),sk:k,review:true,rbx:v.bx})}
let E=store.get('exam',null);
let EH=store.get('examHist',[]);
const ui={game:'chess',tab:'today',quiz:false,idx:0,hint:false,bookS:'math',bookB:'all',bookQ:'',flash:null,noteS:'all',note:{},exSubj:'math',exTime:40,exIdx:0,exConfirm:false,exOpen:{},share:null};

function keyOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const todayKey=()=>keyOf(new Date());
const primaryBand=g=>g==='e5'||g==='e6'?'e56':g;
function pickBand(r,g){const x=r();let acc=0;for(const[b,w]of MIX[g]){acc+=w;if(x<acc)return b}return MIX[g][0][0]}
function makeQ(r,s,b,used){
  const gens=(GENS[s]&&GENS[s][b])||[];
  const fixed=BANK.filter(q=>q.s===s&&q.b===b&&!used.has(q.id)),unseen=fixed.filter(q=>!SEEN[q.id]);
  let useGen;
  if(!gens.length)useGen=false;else if(!fixed.length)useGen=true;else if(unseen.length)useGen=r()<(s==='math'?.6:.45);else useGen=r()<.85;
  if(useGen){
    const order=shuffleR(r,gens.map((_,i)=>i)),free=order.filter(i=>!used.has('g'+s+b+i)),tryList=free.length?free:order;
    const today=dayNum();
    for(let t=0;t<12;t++){
      const gi=tryList[t%tryList.length],g=gens[gi](r);if(!g)continue;const key=skOf(g);
      const recent=RECENT[key]!=null&&today-RECENT[key]<30;
      if((used.has(key)||recent||SR[key])&&t<11)continue;
      used.add('g'+s+b+gi);used.add(key);RECENT[key]=today;
      return Object.assign({s,b,id:'g-'+s+'-'+b+'-'+hash(key).toString(36)},g,{sk:key});
    }
  }
  let pool=unseen.length?unseen:fixed;
  if(!pool.length)pool=BANK.filter(q=>q.s===s&&!used.has(q.id));
  if(!pool.length)pool=BANK.filter(q=>q.s===s);
  const min=Math.min(...pool.map(q=>ST[q.id]||0)),fresh=pool.filter(q=>(ST[q.id]||0)===min);
  const q=fresh[Math.floor(r()*fresh.length)];used.add(q.id);SEEN[q.id]=1;store.set('seen',SEEN);
  const idx=shuffleR(r,[0,1,2,3]);
  return Object.assign({},q,{c:idx.map(i=>q.c[i]),a:idx.indexOf(q.a)});
}
function buildSet(date,grade,count,salt,used,withReview){
  const r=rng(hash(date+'|'+grade+'|'+salt)),order=['math','eng','kor','sci'],out=[];used=used||new Set();
  const due=withReview?Object.entries(SR).filter(([k,v])=>v.due<=dayNum(date)).sort((a,b)=>a[1].due-b[1].due):[];
  let quota=Math.min(due.length,Math.max(1,Math.round(count*.3)));
  for(let i=0;i<count;i++){const s=order[i%4];let q=null;
    if(quota>0){const j=due.findIndex(([k,v])=>v.q.s===s&&!used.has(k));if(j>=0){const[k,v]=due.splice(j,1)[0];q=reviewQ(r,k,v);used.add(k);quota--}}
    out.push(q||makeQ(r,s,pickBand(r,grade),used))}
  store.set('recent',RECENT);
  return out;
}
function saveDay(){store.set('day',D)}
function ensureDay(){
  const k=todayKey();
  if(!D||D.date!==k||D.grade!==S.grade||D.base!==S.count){
    D={date:k,grade:S.grade,base:S.count,qs:buildSet(k,S.grade,S.count,'main',null,true),ans:[],bonus:0};saveDay();
    ui.quiz=false;ui.idx=0;
  }
}
function updHistory(){
  const ans=D.ans,answered=D.qs.map((_,i)=>ans[i]).filter(v=>v!=null).length;
  let c=0;D.qs.forEach((q,i)=>{if(ans[i]===q.a)c++});
  const baseDone=D.qs.slice(0,D.base).every((_,i)=>ans[i]!=null);
  H[D.date]=Object.assign(H[D.date]||{},{a:answered,c,done:baseDone});store.set('history',H);
}
function streak(){let n=0;const d=new Date();if(!(H[keyOf(d)]&&H[keyOf(d)].done))d.setDate(d.getDate()-1);
  while(H[keyOf(d)]&&H[keyOf(d)].done){n++;d.setDate(d.getDate()-1)}return n}
function totals(){let a=0,c=0;Object.values(H).forEach(h=>{a+=h.a||0;c+=h.c||0});return{a,c}}
function monthDays(){const p=todayKey().slice(0,7);return Object.keys(H).filter(k=>k.startsWith(p)&&((H[k].a||0)>0||(H[k].ex||0)>0)).length}
const monthName=()=>(new Date().getMonth()+1)+'월';
const firstOpen=()=>{const i=D.qs.findIndex((_,k)=>D.ans[k]==null);return i};

  try{navigator.clipboard.writeText(text).then(()=>toast('문구를 복사했어요. 메신저에 붙여 넣으세요.'),fallback)}catch(_){fallback()}

const EXAM_MIX={e4:[['e4',1]],e5:[['e56',1]],e6:[['e56',.8],['m1',.2]],m1:[['m1',.85],['e56',.15]],m2:[['m2',.8],['m1',.2]],m3:[['m3',.8],['m2',.2]]};

function examTitle(s){return s==='all'?'전 과목':SUBJ[s]}
function startExam(){
  const r=rng((Date.now()^hash(S.grade))>>>0),subs=ui.exSubj==='all'?['kor','eng','math','sci']:[ui.exSubj],per=ui.exSubj==='all'?5:20,used=new Set(),qs=[];
  const pb=r2=>{const x=r2();let a=0;for(const[b,w]of EXAM_MIX[S.grade]){a+=w;if(x<a)return b}return EXAM_MIX[S.grade][0][0]};
  subs.forEach(s=>{for(let i=0;i<per;i++)qs.push(makeQ(r,s,pb(r),used))});
  E={subj:ui.exSubj,grade:S.grade,qs,ans:[],start:Date.now(),limit:ui.exTime*60,done:false};store.set('exam',E);
  ui.exIdx=0;ui.exConfirm=false;ui.exOpen={};window.scrollTo(0,0);
}
function remain(){return E.limit?Math.max(0,Math.round(E.limit-(Date.now()-E.start)/1000)):null}
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function fmtDur(ms){const s=Math.round(ms/1000);return Math.floor(s/60)+'분 '+(s%60)+'초'}
function submitExam(){
  if(!E||E.done)return;E.done=true;E.end=Date.now();
  let c=0;E.qs.forEach((q,i)=>{if(E.ans[i]===q.a)c++;else addWrong(q);srUpdate(q,E.ans[i]===q.a)});
  E.c=c;store.set('exam',E);
  const k=todayKey();H[k]=Object.assign(H[k]||{a:0,c:0,done:false},{ex:((H[k]&&H[k].ex)||0)+1});store.set('history',H);
  EH.unshift({date:k,subj:E.subj,grade:E.grade,c,n:E.qs.length,time:E.end-E.start});if(EH.length>30)EH.length=30;store.set('examHist',EH);

function genMoves(s){

          if(s.cs.Q&&!b[59]&&!b[58]&&!b[57]&&b[56]==='R'&&!attacked(b,60,op)&&!attacked(b,59,op)&&!attacked(b,58,op))mv.push({f:60,t:58,cs:1})}

const PV={P:100,N:320,B:330,R:500,Q:900,K:0};

 Q:[-20,-10,-10,-5,-5,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,5,5,5,0,-10,-5,0,5,5,5,5,0,-5,0,0,5,5,5,5,0,-5,-10,5,5,5,5,5,0,-10,-10,0,5,0,0,0,0,-10,-20,-10,-10,-5,-5,-10,-10,-20],

 {t:'둘 수 없는 곳(자충수)',x:'돌을 놓자마자 숨구멍이 0개가 되는 곳에는 둘 수 없어요. 이것을 <b>자충수 금지</b>라고 해요. (단, 그 수로 상대 돌을 따낼 수 있으면 둘 수 있어요.)',q:'흰 돌로 둘러싸인 가운데 빈 점을 눌러 보세요. 둘 수 있을까요?',B:[[1,1],[7,7]],W:[[3,4],[4,3],[4,5],[5,4],[3,3],[3,5],[5,3],[5,5]],ans:[[4,4]],illegalOk:true,h:'가운데 빈 점(4줄·4칸째)을 눌러 보세요.',hl:'mark',ok:'맞아요, 여기는 놓자마자 숨구멍이 없어서 둘 수 없어요!'},
 {t:'두 눈이면 살아요',x:'돌 덩어리 안에 따로 떨어진 빈 점(<b>눈</b>)이 <b>두 개</b> 있으면, 상대는 어느 쪽에도 둘 수 없어서 절대 잡을 수 없어요.',q:'흑 덩어리가 두 눈을 만들 수 있는 급소에 두세요.',B:[[8,0],[7,0],[7,1],[7,2],[7,3],[7,4],[8,4]],W:[[6,0],[6,1],[6,2],[6,3],[6,4],[6,5],[7,5],[8,5]],ans:[[8,2]],h:'빈 점 세 칸 중 한가운데가 급소예요.',hl:'mark',ok:'왼쪽과 오른쪽에 눈이 하나씩, 두 눈이 생겼어요. 이제 이 흑 돌들은 살았어요!'},
 {t:'집 세기와 승부',x:'바둑은 <b>집이 많은 쪽이 이겨요.</b> 이 앱은 <b>내 돌 + 내 돌로 둘러싼 빈 점</b>을 세요(작은 네모가 집). 백은 나중에 두니까 <b>덤 6.5집</b>을 더 받아요.',q:'오른쪽 판에서 흑은 돌 9 + 집 36 = 45집, 백은 돌 9 + 집 27 = 36 + 덤 6.5 = 42.5집. 흑이 이겼어요! 확인했으면 아무 칸이나 눌러요.',B:[[0,4],[1,4],[2,4],[3,4],[4,4],[5,4],[6,4],[7,4],[8,4]],W:[[0,5],[1,5],[2,5],[3,5],[4,5],[5,5],[6,5],[7,5],[8,5]],ans:'any',terr:true,h:'아무 빈 칸이나 눌러요.',hl:'none',ok:'이제 컴퓨터와 대국하면서 코치의 도움을 받아 보세요!'}
];
function lessonBoard(L){const b=new Array(GSZ).fill(0);L.B.forEach(([r,c])=>b[PT(r,c)]=1);L.W.forEach(([r,c])=>b[PT(r,c)]=2);return b}
let GL=null;
function lessonOpen(k){const L=LESSONS[k];GL={k,b:lessonBoard(L),done:false,hint:false,msg:'',bad:-1,last:-1}}
function lessonTap(i){
  if(!GL||GL.done)return;const L=LESSONS[GL.k],ok=L.ans==='any'||L.ans.some(([r,c])=>PT(r,c)===i);
  if(L.illegalOk){if(ok){GL.done=true;GL.msg=L.ok;GL.bad=i}else{GL.msg='그곳이 아니에요. 흰 돌로 둘러싸인 가운데 빈 점을 눌러 보세요.';GL.hint=true}markLesson();render();return}
  if(ok){const t=GL.b.slice(),r=L.ans==='any'?-1:goPlayIP(t,i,1,-1);if(r!==-2&&L.ans!=='any'){GL.b=t;GL.last=i}GL.done=true;GL.msg=L.ok;markLesson();render();return}
  const t=GL.b.slice();if(goPlayIP(t,i,1,-1)===-2)GL.msg='거기는 둘 수 없는 자리예요. 다른 곳을 찾아봐요.';else GL.msg='음… 다시 생각해 봐요. '+L.h;GL.hint=true;render();
}
function markLesson(){GM.goLearn=GM.goLearn||{};GM.goLearn[GL.k]=1;store.set('games',GM)}
function viewLearn(){
  if(!GL)lessonOpen(Math.min(LESSONS.length-1,Object.keys((GM.goLearn||{})).length));
  const L=LESSONS[GL.k],marks=[];
  if(GL.hint&&!GL.done){if(L.hl==='libW'||L.hl==='libB'){const col=L.hl==='libW'?2:1;const s=GL.b.findIndex(v=>v===col);if(s>=0)goGroup(GL.b,s).libs.forEach(i=>marks.push({i,t:'lib'}))}else L.ans!=='any'&&L.ans.forEach(([r,c])=>marks.push({i:PT(r,c),t:'hint'}))}
  if(GL.done&&GL.bad>=0)marks.push({i:GL.bad,t:'bad'});
  let terr=null;if(L.terr){terr=new Array(GSZ).fill(0);for(let i=0;i<GSZ;i++)if(!GL.b[i])terr[i]=(i%GN)<4?1:2}
  const done=GM.goLearn||{};
  return'<div class="lessonnav">'+LESSONS.map((x,k)=>'<button class="'+(k===GL.k?'on':'')+(done[k]?' done':'')+'" data-act="lsel" data-k="'+k+'" aria-label="'+(k+1)+'. '+x.t+'">'+(k+1)+'</button>').join('')+'</div>'+
  '<div class="eyebrow">기초 '+(GL.k+1)+' / '+LESSONS.length+'</div><h3 style="margin:4px 0 6px">'+L.t+'</h3><p class="lx">'+L.x+'</p>'+
  '<div class="lq'+(GL.done?' ok':'')+'"><b>'+(GL.done?'잘했어요!':'해 보기')+'</b> '+(GL.done?GL.msg:L.q)+'</div>'+(GL.msg&&!GL.done?'<div class="gnote">'+GL.msg+'</div>':'')+
  goBoardSVG(GL.b,{act:GL.done?null:'lpt',marks,libs:GL.k<4,last:GL.last,terr})+
  '<div class="row" style="margin-top:12px">'+(GL.done?(GL.k<LESSONS.length-1?'<button class="btn primary" data-act="lnext">다음 배우기</button>':'<button class="btn primary" data-act="gomode" data-m="play">코치와 대국하기</button>')+'<button class="btn line" data-act="lretry">다시 하기</button>':'<button class="btn line" data-act="lhint">힌트 보기</button>')+'</div>';
}
/* 코치: 대국 중 조언 */
function goCoach(){
  const b=GG.b,tips=[],marks=[],seen=new Uint8Array(GSZ);
  for(let i=0;i<GSZ;i++){if(!b[i]||seen[i])continue;const gr=goGroup(b,i);gr.stones.forEach(s=>seen[s]=1);if(gr.libs.size!==1)continue;const lib=[...gr.libs][0],n=gr.stones.length;
    if(b[i]===1){const t=b.slice();const r=goPlayIP(t,lib,1,GG.ko);const after=r===-2?0:goLibs(t,lib);tips.push(after>=2?'⚠ 흑 돌 '+n+'개가 <b>단수</b>예요! 주황 동그라미에 두면 도망갈 수 있어요.':'⚠ 흑 돌 '+n+'개가 단수인데 도망가도 살기 어려워요. 다른 곳에 두는 것도 방법이에요.');marks.push({i:lib,t:'warn'})}
    else{tips.push('✓ 백 돌 '+n+'개가 단수예요. 초록 동그라미에 두면 <b>따낼 수 있어요!</b>');marks.push({i:lib,t:'cap'})}}
  return{tips,marks};
}
function goExplainMine(prev,i,caps){
  const libs=goLibs(GG.b,i),parts=[];
  if(caps)parts.push('백 돌 '+caps+'개를 따냈어요!');
  if(libs===1)parts.push('방금 둔 돌은 숨구멍이 1개뿐(단수)이라 잡힐 수 있어요.');
  else if(!caps){let at=0;for(const y of NBR[i])if(GG.b[y]===2&&goLibs(GG.b,y)===1)at++;if(at)parts.push('백 돌을 단수로 몰았어요. 상대가 도망가는지 지켜봐요.');}
  return parts.join(' ');
}
function goExplainAI(i,caps){
  if(i<0)return'컴퓨터가 패스했어요. 더 둘 곳이 없으면 나도 패스해서 끝낼 수 있어요.';
  const parts=[];if(caps)parts.push('컴퓨터가 흑 돌 '+caps+'개를 따냈어요.');
  let at=0;for(const y of NBR[i])if(GG.b[y]===1&&goLibs(GG.b,y)===1)at++;
  if(at)parts.push('컴퓨터가 흑 돌을 단수로 만들었어요!');
  return parts.join(' ');
}
function goHint(){
  if(!GG||GG.over||GG.thinking)return;const st={b:GG.b,ko:GG.ko},m=goAI(st,3,1);
  if(m<0){GG.hintAt=-1;GG.coachMsg='지금은 둘 만한 곳이 거의 없어요. 패스해도 좋아요.';render();return}
  const h=goHeur(GG.b,m,1),t=GG.b.slice();goPlayIP(t,m,1,GG.ko);let why='집을 넓히고 돌을 튼튼하게 하는 자리예요.';
  let capd=0;for(let x=0;x<GSZ;x++)if(GG.b[x]===2&&t[x]===0)capd++;
  if(capd)why='백 돌 '+capd+'개를 따낼 수 있는 자리예요.';else if(NBR[m].some(y=>GG.b[y]===1&&goLibs(GG.b,y)===1))why='단수된 흑 돌을 살리는 자리예요.';else if(NBR[m].some(y=>t[y]===2&&goLibs(t,y)===1))why='백 돌을 단수로 모는 자리예요.';
  GG.hintAt=m;GG.coachMsg='💡 추천: 파란 점선 자리. '+why;render();
}

function resultBox(game){const o=game==='chess'?CG:GG;return'<div class="gresult '+(o.over==='win'?'win':o.over==='loss'?'loss':'')+'"><b>'+(o.over==='win'?'승리!':o.over==='loss'?'패배':'무승부')+'</b><p>'+o.res+'</p><button class="btn primary block" data-act="gnew" data-g="'+game+'">다음 판 ('+GM[game].lv+'단계)</button></div>'}
function goMode(){return ui.goMode||(Object.keys(GM.goLearn||{}).length>=LESSONS.length?'play':'learn')}
function viewRest(){
  const g=ui.game||'chess',R=GM[g];
  const pips=Array.from({length:MAXLV},(_,k)=>'<i class="'+(k<R.lv?'on':'')+'"></i>').join('');
  return'<div class="stack"><div class="tabs two">'+[['chess','체스'],['go','바둑']].map(([k,l])=>'<button class="'+(g===k?'on':'')+'" data-act="gtab" data-g="'+k+'">'+l+'</button>').join('')+'</div>'+
  '<section class="card lvcard"><div class="lvtop"><div><div class="eyebrow">컴퓨터 단계</div><div class="lvname">'+R.lv+'단계 · '+LV_NAME[R.lv]+'</div></div><div class="pips">'+pips+'</div></div>'+
  '<div class="muted small">이기면 한 단계 올라가요. 지면 같은 단계에서 한 판 더, 또 지면 한 단계 내려가요.'+(R.ls?' <b style="color:var(--bad)">지금은 "한 판 더" 기회예요.</b>':'')+'</div>'+
  '<div class="rec">승 <b>'+R.w+'</b> · 패 <b>'+R.l+'</b>'+(g==='chess'?' · 무 <b>'+R.d+'</b>':'')+'</div></section>'+
  (g==='go'?'<div class="tabs two">'+[['learn','기초 배우기'],['play','컴퓨터와 대국']].map(([k,l])=>'<button class="'+(goMode()===k?'on':'')+'" data-act="gomode" data-m="'+k+'">'+l+'</button>').join('')+'</div>':'')+
  '<section class="card gamecard">'+(g==='chess'?viewChess():goMode()==='learn'?viewLearn():viewGo())+'</section></div>';
}

/* ============ 동작 ============ */
function addWrong(q){W=W.filter(w=>w.id!==q.id);W.unshift(Object.assign({},q,{date:D.date}));if(W.length>150)W.length=150;store.set('wrong',W)}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const act=t.dataset.act;
  if(act==='closesheet'&&e.target!==t)return;
  switch(act){
  case'tab':ui.tab=t.dataset.tab;if(ui.tab==='today'&&firstOpen()!==-1&&ui.quiz){}window.scrollTo(0,0);break;
  case'start':ui.quiz=true;ui.idx=Math.max(0,firstOpen());ui.hint=false;break;
  case'result':ui.quiz=true;ui.idx=D.qs.length;break;
  case'exit':ui.quiz=false;break;
  case'hint':ui.hint=!ui.hint;break;
  case'pick':{
    const card=t.closest('.note');const i=+t.dataset.i;
    if(card){const w=W.find(x=>x.id===card.dataset.id);if(w&&ui.note[w.id]==null){ui.note[w.id]=i;if(i===w.a){ST[w.id]=(ST[w.id]||0)+1;store.set('stats',ST)}srUpdate(w,i===w.a)}break}
    const q=D.qs[ui.idx];if(D.ans[ui.idx]!=null)break;
    D.ans[ui.idx]=i;if(i===q.a){ST[q.id]=(ST[q.id]||0)+1;store.set('stats',ST)}else addWrong(q);srUpdate(q,i===q.a);
    saveDay();updHistory();break}
  case'next':{const fo=firstOpen();ui.hint=false;if(fo===-1)ui.idx=ui.idx+1;else{let n=ui.idx+1;while(n<D.qs.length&&D.ans[n]!=null)n++;ui.idx=n<D.qs.length?n:fo}window.scrollTo(0,0);break}
  case'prev':ui.idx=Math.max(0,ui.idx-1);ui.hint=false;window.scrollTo(0,0);break;
  case'review':ui.idx=0;window.scrollTo(0,0);ui.reviewing=true;break;
  case'bonus':{const used=new Set(D.qs.map(q=>q.id));D.bonus=(D.bonus||0)+1;const start=D.qs.length;D.qs=D.qs.concat(buildSet(D.date,S.grade,5,'bonus'+D.bonus,used));saveDay();updHistory();ui.idx=start;ui.quiz=true;ui.hint=false;window.scrollTo(0,0);break}
  case'concept':{const c=CONMAP[t.dataset.id];if(!c)break;ui.tab='book';ui.bookQ='';ui.bookS=c.s;ui.bookB='all';ui.flash=c.id;break}
  case'bs':ui.bookS=t.dataset.s;break;
  case'bb':ui.bookB=t.dataset.b;break;
  case'ns':ui.noteS=t.dataset.s;break;
  case'nremove':W=W.filter(w=>w.id!==t.dataset.id);delete ui.note[t.dataset.id];store.set('wrong',W);break;
  case'nretry':delete ui.note[t.dataset.id];break;
  case'settings':$('#sheet').innerHTML=viewSheet();$('#sheet').hidden=false;return;
  case'gtab':ui.game=t.dataset.g;break;
  case'csq':chessTap(+t.dataset.i);return;
  case'gpt':goTap(+t.dataset.i);return;
  case'gpass':goPass();return;
  case'ghint':goHint();return;
  case'gcoach':GM.goCoach=GM.goCoach===false;store.set('games',GM);break;
  case'glibs':GM.goLibs=!GM.goLibs;store.set('games',GM);break;
  case'gomode':ui.goMode=t.dataset.m;ui.game='go';break;
  case'lpt':lessonTap(+t.dataset.i);return;
  case'lsel':lessonOpen(+t.dataset.k);break;
  case'lnext':lessonOpen(Math.min(LESSONS.length-1,GL.k+1));break;
  case'lretry':lessonOpen(GL.k);break;
  case'lhint':GL.hint=true;GL.msg=LESSONS[GL.k].h;break;
  case'gresign':{const g=t.dataset.g,o=g==='chess'?CG:GG;if(!o||o.over||o.thinking)return;o.over='loss';o.msg='기권했어요.';o.res=applyResult(g,'loss');break}
  case'gnew':if(t.dataset.g==='chess')chessNew();else goNew();break;
  case'share':doShare(ui.share||'');return;
  case'copyshare':copyText(ui.share||'');return;
  case'exsubj':ui.exSubj=t.dataset.s;break;
  case'extime':ui.exTime=+t.dataset.m;break;
  case'exstart':startExam();break;
  case'expick':{if(!E||E.done)break;const k=+t.dataset.i;E.ans[ui.exIdx]=E.ans[ui.exIdx]===k?null:k;store.set('exam',E);break}
  case'exnav':ui.exIdx=Math.min(E.qs.length-1,Math.max(0,ui.exIdx+(+t.dataset.d)));ui.exConfirm=false;window.scrollTo(0,0);break;
  case'exgo':ui.exIdx=+t.dataset.i;ui.exConfirm=false;window.scrollTo(0,0);break;
  case'exsubmit':ui.exConfirm=true;ui.exQuit=false;break;
  case'excancel':ui.exConfirm=false;ui.exQuit=false;break;
  case'exfinal':submitExam();break;
  case'exquit':ui.exQuit=true;ui.exConfirm=false;break;
  case'exquityes':E=null;store.set('exam',null);ui.exQuit=false;break;
  case'exnew':E=null;store.set('exam',null);window.scrollTo(0,0);break;
  case'exopen':{const k=+t.dataset.i;ui.exOpen[k]=true;render();const el=document.getElementById('rq-'+k);if(el)el.scrollIntoView({block:'start',behavior:'smooth'});return}
  case'setgrade':S.grade=t.dataset.g;store.set('settings',S);ensureDay();$('#sheet').innerHTML=viewSheet();render();return;
  case'setcount':S.count=+t.dataset.n;store.set('settings',S);ensureDay();$('#sheet').innerHTML=viewSheet();render();return;
  case'closesheet':case'closesheet2':$('#sheet').hidden=true;break;
  }
  render();
});
document.addEventListener('input',e=>{if(e.target.id==='nick'){S.nick=e.target.value.trim();store.set('settings',S);return}if(e.target.id==='bsearch'){ui.bookQ=e.target.value;const pos=e.target.selectionStart;render();const s=$('#bsearch');s.focus();try{s.setSelectionRange(pos,pos)}catch(_){}}});
/* 안드로이드 뒤로 가기 버튼용 */
window.appBack=function(){
  if(!$('#sheet').hidden){$('#sheet').hidden=true;render();return true}
  if(ui.tab==='exam'&&E&&!E.done){if(!ui.exQuit){ui.exQuit=true;render()}return true}
  if(ui.tab!=='today'){ui.tab='today';render();return true}
  if(ui.quiz){ui.quiz=false;render();return true}
  return false;
};
render();
</script>
