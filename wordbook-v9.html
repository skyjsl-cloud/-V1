<style>
/* Layout: one phone-width column; study screens take the full height, bottom tab bar otherwise. Deliberately dark-only, like a night study app. */
:root{
  --bg:#141226; --surface:#1f1c39; --surface-2:#2a2650; --line:#39346a;
  --fg:#eeedf8; --muted:#9c98c3; --accent:#7462f2; --accent-text:#ad9fff;
  --good:#5fd8a3; --bad:#ff8396; --warn:#ffc46b;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-word:"Fraunces",Georgia,"Times New Roman",serif;
  --f-ipa:"Noto Sans","Segoe UI","Lucida Sans Unicode","Arial Unicode MS",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--accent-text);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:12px 16px 110px;min-height:100%}
#app.run{padding-bottom:24px}
h1{font-size:22px;margin:4px 0 16px;text-align:center;font-weight:700;text-wrap:balance}
h2{font-size:17px;margin:0;font-weight:700;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:13px}
.topbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin-bottom:14px}
.topbar h1{margin:0;font-size:19px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.icon-btn svg{width:20px;height:20px}
.panel{background:var(--surface);border-radius:20px;padding:6px 18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .lbl{font-weight:500}
.row .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.stack{display:flex;flex-direction:column;gap:14px}
select.inline{background:transparent;border:0;color:var(--fg);text-align:right;font-weight:500;padding:4px 0;max-width:60%}
select.inline option{background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip.on{background:var(--surface-2);border-color:var(--accent-text);color:var(--fg)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;background:var(--accent);color:#fff;font-weight:700;font-size:16px}
.btn svg{width:20px;height:20px;flex:none}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn[disabled]{opacity:.5}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* goal card */
.goal{background:var(--surface);border-radius:20px;padding:18px}
.goal-top{display:flex;justify-content:space-between;align-items:flex-start}
.goal .num{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.goal .num small{font-size:17px;color:var(--muted);font-weight:500}
.flame{width:52px;height:52px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.flame.lit{background:#3b2a1b;color:var(--warn)}
.flame svg{width:26px;height:26px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);margin:14px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent-text);border-radius:99px;transition:width .3s}
.goal-foot{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.goal-foot b{color:var(--fg);font-variant-numeric:tabular-nums}

/* mode grid */
.modes{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:20px;overflow:hidden;gap:1px;background-clip:padding-box}
.modes{background:var(--line)}
.mode{background:var(--surface);padding:26px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:700;font-size:16px}
.mode svg{width:34px;height:34px;color:var(--accent-text)}
.mode:active{background:var(--surface-2)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:999px;font-size:12px;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{background:var(--surface-2);color:var(--accent-text)}

/* word lists */
.group{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:18px;padding:16px;text-align:left;width:100%}
.group-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lvbar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.lvbar i{display:block;height:100%}
.lv-hard{background:var(--bad)} .lv-unsure{background:var(--warn)} .lv-known{background:var(--good)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;background:currentColor}
.legend .h{color:var(--bad)} .legend .u{color:var(--warn)} .legend .k{color:var(--good)}
.legend em{font-style:normal;color:var(--muted)}
.word-item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.word-item:last-child{border-bottom:0}
.word-item .w{font-family:var(--f-word);font-size:18px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.word-item .m{grid-column:1;font-size:14px;color:var(--muted);min-width:0}
.word-item .acts{grid-row:1/span 2;grid-column:2;display:flex;gap:4px;align-items:center}
.lvtag{font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.lvtag.hard{color:var(--bad)} .lvtag.unsure{color:var(--warn)} .lvtag.known{color:var(--good)}
.star-btn{width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.star-btn.on{color:var(--warn)}
.star-btn svg{width:20px;height:20px}
.pos{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-right:5px;color:var(--muted);vertical-align:1px}
.ipa{font-family:var(--f-ipa);color:var(--muted)}

/* session */
.prog{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:var(--accent-text);transition:width .25s}
.card{position:relative;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:26px;min-height:min(58vh,440px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 22px;text-align:center;gap:12px;width:100%}
.card .big{font-family:var(--f-word);font-size:clamp(30px,9vw,44px);font-weight:700;line-height:1.15;overflow-wrap:anywhere;text-wrap:balance}
.card .big.ko{font-family:var(--f-body);font-size:clamp(24px,7vw,32px)}
.card .back{border-top:1px dashed var(--line);padding-top:14px;margin-top:4px;display:flex;flex-direction:column;gap:6px;animation:rise .25s ease-out}
.card .back .mean{font-size:20px;font-weight:500}
.card .back .mean.en{font-family:var(--f-word);font-size:24px;font-weight:600}
.card .memo{font-size:13px;color:var(--muted)}
.card .hint{position:absolute;bottom:16px;left:0;right:0;font-size:12px;color:var(--muted)}
.card .corner{position:absolute;top:12px;left:12px}
.card .corner-r{position:absolute;bottom:10px;right:12px}
.speak{width:42px;height:42px;display:grid;place-items:center;color:var(--fg);border-radius:50%}
.speak svg{width:24px;height:24px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.answer-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.answer-row button{padding:17px 8px;border-radius:16px;background:var(--surface);font-weight:700;border:1px solid var(--line)}
.answer-row .no{color:var(--bad)} .answer-row .yes{color:var(--good)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{padding:15px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;font-weight:500}
.opt.en{font-family:var(--f-word);font-size:18px;font-weight:600}
.opt.right{border-color:var(--good);background:#173b33;color:#d6fff0}
.opt.wrong{border-color:var(--bad);background:#43202b;color:#ffe2e7}
.card.small-card{min-height:200px}
.dict-input{width:100%;margin-top:16px;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-word);font-size:22px;text-align:center}
.feedback{margin-top:12px;text-align:center;font-weight:700}
.feedback.ok{color:var(--good)} .feedback.ng{color:var(--bad)}
.feedback .correct{display:block;font-family:var(--f-word);font-size:22px;color:var(--fg);font-weight:600}
.auto-ctl{display:flex;justify-content:center;gap:16px;margin-top:18px}
.auto-ctl button{width:56px;height:56px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.auto-ctl button.main{width:68px;height:68px;background:var(--accent);border:0;color:#fff}
.auto-ctl svg{width:24px;height:24px}
.result{background:var(--surface);border-radius:22px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:8px}
.result .score{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.result-list{text-align:left;margin-top:8px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(6,5,16,.66);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sheet-top h2{flex:1;text-align:center}
.ok-btn{width:44px;height:44px;border-radius:50%;background:#3d8bff;color:#fff;display:grid;place-items:center}
.ok-btn svg{width:22px;height:22px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid transparent;background:var(--surface-2)}
.field input:focus,.field textarea:focus{border-color:var(--accent-text);outline:none}
.field textarea{min-height:160px;resize:vertical;font-size:14px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:34px 16px;border:2px dashed var(--line);border-radius:20px;text-align:center;cursor:pointer;background:var(--surface)}
.drop svg{width:42px;height:42px;color:var(--accent-text)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.tips{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.review{display:flex;flex-direction:column;gap:8px}
.rv{display:grid;grid-template-columns:28px 1fr;gap:6px 8px;align-items:start;background:var(--surface);border-radius:14px;padding:10px}
.rv input[type=checkbox]{width:20px;height:20px;margin:8px 0 0;accent-color:var(--accent)}
.rv .rv-fields{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
.rv .rv-fields input{min-width:0;padding:8px 10px;border-radius:10px;border:1px solid transparent;background:var(--surface-2);font-size:14px}
.rv .rv-fields input.w{font-family:var(--f-word);font-weight:600;font-size:16px}
.rv .rv-fields input.p{grid-column:1/-1;font-family:var(--f-ipa);font-size:13px;color:var(--muted)}
.rv.off{opacity:.45}
.spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--surface-2);border-top-color:var(--accent-text);animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--muted)}
.notice.err{border-color:var(--bad);color:#ffd5dc}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:6px 10px;border-radius:9px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:40;max-width:calc(100% - 32px);text-align:center}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.section-label{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:500}
#backZone{position:fixed;left:0;top:0;bottom:0;width:12px;z-index:30;pointer-events:none}
#backZone i{position:absolute;left:4px;top:50%;width:4px;height:48px;margin-top:-24px;border-radius:4px;background:var(--line);opacity:.8;transition:background .15s,width .15s}
#backZone.hit i{background:var(--accent-text);width:6px;opacity:1}
body{touch-action:manipulation}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

// ---------- data ----------
const DAY28 = [

const OCR_PROMPT = `The attached photo(s) show a page of a Korean English-vocabulary workbook for middle-school students.
Extract every vocabulary entry printed on the page, in book order (left column top to bottom, then right column).
Rules:
- Ignore faint mirrored text that shows through from the back of the paper, handwriting, page numbers, checkboxes, entry numbers and section headings.
- "w": the English word or phrase exactly as printed.
- "m": the Korean meaning exactly as printed. If there are two parts of speech with different meanings, join them with "; ".
- "p": the pronunciation inside [ ] without the brackets, or "" if none.
- "pos": the part-of-speech mark(s) printed in boxes (\uba85, \ub3d9, \ud615, \ubd80, \ub300, \uc804, \uc811 \u2026), joined with "\u00b7", or "" if none.
- "title": the page title such as "Day 28" if visible, else "".
Reply with only JSON in this shape:
{"title":"Day 28","words":[{"w":"supermarket","m":"\uc288\ud37c\ub9c8\ucf13","p":"s\u00fa:p\u0259rm\u00e0:rkit","pos":"\uba85"}]}`;

const OCR_KEY='photo-wordbook.ocr';
function ocrCfg(){try{return {provider:'gemini',key:'',...(JSON.parse(localStorage.getItem(OCR_KEY))||{})}}catch(e){return {provider:'gemini',key:''}}}
function saveOcrCfg(c){try{localStorage.setItem(OCR_KEY,JSON.stringify(c))}catch(e){}}
const useSample=()=>!!(SAMPLE&&CAN_IMG);
const canOCR=()=>useSample()||!!ocrCfg().key;
const maxImgs=()=>useSample()?IMG_MAX:3;
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url});
    const sc=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.85).split(',')[1];
  } finally {URL.revokeObjectURL(url)}
}
function parseLoose(t){
  t=String(t||'').replace(/```(?:json)?/g,'');
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<a) throw {code:'invalid_json'};
  try{return JSON.parse(t.slice(a,b+1))}catch(e){throw {code:'invalid_json'}}
}
async function apiOCR(files,signal){
  const cfg=ocrCfg(); const imgs=await Promise.all(files.map(shrink));
  let r, j;
  if(cfg.provider==='claude'){
    r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,
      headers:{'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:8000,messages:[{role:'user',content:[
        ...imgs.map(d=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:d}})),{type:'text',text:OCR_PROMPT}]}]})});
    j=await r.json().catch(()=>({}));
    if(!r.ok) throw {code:'api',status:r.status};
    return parseLoose((j.content||[]).map(c=>c.text||'').join(''));
  }
  // Reading a printed page needs no long reasoning, so thinking is turned down; the answer streams in so progress shows.
  const thinking=m=>/gemini-[3-9]/.test(m)?{thinkingLevel:/pro/.test(m)?'low':'minimal'}:/gemini-2\.5/.test(m)?{thinkingBudget:/pro/.test(m)?128:0}:null;
  const call=(m,useThink)=>{
    const gc={responseMimeType:'application/json',temperature:0};
    const t=useThink&&thinking(m); if(t) gc.thinkingConfig=t;
    return fetch(GEM+'/models/'+m+':streamGenerateContent?alt=sse&key='+encodeURIComponent(cfg.key),{method:'POST',signal,headers:{'content-type':'application/json'},
      body:JSON.stringify({contents:[{parts:[...imgs.map(d=>({inline_data:{mime_type:'image/jpeg',data:d}})),{text:OCR_PROMPT}]}],generationConfig:gc})});
  };
  const tryModel=async m=>{let x=await call(m,true); if(x.status===400) x=await call(m,false); return x};  // 400: model rejects the thinking setting
  const busy=s=>s===500||s===503||s===504;
  const tried=new Set(); let others=null;
  let model=cfg.model||'gemini-flash-latest';
  for(let round=0; round<4; round++){
    tried.add(model);
    r=await tryModel(model);
    if(busy(r.status)){                     // overloaded: wait a moment and ask once more
      ocrStatus('\uc11c\ubc84\uac00 \ubd90\ubcbc\uc11c \uc7a0\uc2dc \ud6c4 \ub2e4\uc2dc \uc2dc\ub3c4\ud558\ub294 \uc911');
      await new Promise(res=>setTimeout(res,2500)); if(signal.aborted) throw {code:'cancelled'};
      r=await tryModel(model);
    }
    if(r.ok) break;
    if(r.status!==404&&!busy(r.status)) break;
    if(!others) others=await listGeminiModels(cfg.key,signal);   // retired or busy: move to another model this key can use
    const next=others.find(m=>!tried.has(m)); if(!next) break;
    model=next; ocrStatus('\ub2e4\ub978 AI \ubaa8\ub378\ub85c \ub2e4\uc2dc \uc77d\ub294 \uc911');
  }
  if(!r.ok) throw {code:'api',status:r.status};
  if(cfg.model!==model){cfg.model=model; saveOcrCfg(cfg)}
  let text='', buf='';
  const reader=r.body.getReader(), dec=new TextDecoder();
  for(;;){
    const {value,done}=await reader.read(); if(done) break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n'); buf=lines.pop();
    for(const ln of lines){
      if(!ln.startsWith('data:')) continue;
      try{const d=JSON.parse(ln.slice(5)); for(const p of (d.candidates?.[0]?.content?.parts||[])) if(!p.thought&&p.text) text+=p.text}catch(e){}
    }
    ocrProgress((text.match(/"w"\s*:/g)||[]).length);
  }
  if(buf.startsWith('data:')){try{const d=JSON.parse(buf.slice(5)); for(const p of (d.candidates?.[0]?.content?.parts||[])) if(!p.thought&&p.text) text+=p.text}catch(e){}}
  return parseLoose(text);
}
function ocrProgress(n){const el=document.getElementById('ocrCount'); if(el) el.textContent=n?`\ub2e8\uc5b4 ${n}\uac1c \uc77d\uc74c`:'\uc0ac\uc9c4\uc744 \ubcf4\uace0 \uc788\uc5b4\uc694'}
const GEM='https://generativelanguage.googleapis.com/v1beta';
function ocrStatus(t){const el=document.getElementById('ocrCount'); if(el) el.textContent=t}
async function listGeminiModels(key,signal){
  let models=[], token='';
  for(let page=0;page<5;page++){
    const r=await fetch(GEM+'/models?pageSize=1000&key='+encodeURIComponent(key)+(token?'&pageToken='+token:''),{signal});
    if(!r.ok) throw {code:'api',status:r.status};
    const j=await r.json(); models.push(...(j.models||[])); token=j.nextPageToken; if(!token) break;
  }
  const ok=models.filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
    .map(m=>String(m.name||'').replace(/^models\//,''))
    .filter(n=>/^gemini/.test(n)&&!/(tts|image|audio|live|embed|robotics|computer|native)/i.test(n));
  const score=n=>{const v=parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1]||0);
    return (/flash/.test(n)?1000:0)+(/lite/.test(n)?-300:0)+(/latest/.test(n)?50:0)+(/(preview|exp)/.test(n)?-60:0)+v*10;};
  ok.sort((a,b)=>score(b)-score(a));
  return ok.slice(0,6);
}

function buildPool(){
  const s=S.settings;
  let ws = s.group==='all'?allWords():(findGroup(s.group)?.words||[]);
  ws = ws.filter(w=>s.levels.includes(w.lv));
  if(s.starOnly) ws=ws.filter(w=>w.star);
  return ws;
}

// ---------- back / undo (double-tap the left edge) ----------
const SNAP_ACTS=new Set(['flip','fl','pick','next','dictcheck','dictskip','nextsec']);
function snap(){
  const s=ui.sess; if(!s) return; const w=s.done?null:cur(); const lk=dkey(new Date());
  ui.hist.push({sess:{...s,missed:[...s.missed]}, wid:w?.id, lv:w?.lv, lk, log:S.log[lk]||0});
  if(ui.hist.length>300) ui.hist.shift();
}
function goBack(){
  if(ui.sheet){ if(ui.photo?.ctl) ui.photo.ctl.abort(); if(ui.sheet==='key') A.skipkey(); ui.sheet=null; ui.photo=null; ui.confirm=null; render(); toast('\ub2eb\uc558\uc5b4\uc694'); return }
  if(ui.confirm){ ui.confirm=null; render(); toast('\ucde8\uc18c\ud588\uc5b4\uc694'); return }
  if(ui.view==='run'){
    const s=ui.sess;
    if(s.mode==='auto'){
      if(s.done){ s.done=false; s.playing=false; s.phase=1; render(); toast('\ub9c8\uc9c0\ub9c9 \ub2e8\uc5b4\ub85c \ub3cc\uc544\uc654\uc5b4\uc694'); return }
      if(s.i>0){ A.aprev(); toast('\uc774\uc804 \ub2e8\uc5b4'); return }
    } else {
      const h=ui.hist.pop();
      if(h){
        stopAuto(); ui.sess=h.sess;
        if(h.wid){ const fw=findWord(h.wid); if(fw) fw.w.lv=h.lv }
        S.log[h.lk]=h.log; save(); render(); toast('\ub418\ub3cc\ub838\uc5b4\uc694'); return;
      }
    }
    closeRun(); ui.view='setup'; render(); toast('\uc124\uc815 \ud654\uba74\uc73c\ub85c \ub3cc\uc544\uc654\uc5b4\uc694'); return;
  }
  if(ui.view){ ui.view=null; render(); return }
  if(ui.tab!=='study'){ ui.tab='study'; render(); return }
  toast('\ub354 \ub3cc\uc544\uac08 \ud654\uba74\uc774 \uc5c6\uc5b4\uc694');
}
// A tap in the left fifth of the screen waits briefly: a second tap there means "back",
// otherwise the first tap is delivered as usual (so cards and buttons on the left still work).
(function(){
  const z=document.getElementById('backZone'); let pend=null, replaying=false;
  document.addEventListener('click',e=>{
    if(replaying||e.detail===0) return;                       // our own replay, or keyboard
    if(e.clientX>Math.min(window.innerWidth*0.22,100)) return;
    if(e.target.closest('input,textarea,select,label.drop')) return; // typing and the photo picker stay instant
    e.preventDefault(); e.stopPropagation();
    if(pend){ clearTimeout(pend); pend=null; z.classList.add('hit'); setTimeout(()=>z.classList.remove('hit'),250); goBack(); return }
    const el=e.target, x=e.clientX, y=e.clientY;
    pend=setTimeout(()=>{ pend=null; if(!el.isConnected) return; replaying=true;
      try{ el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,clientX:x,clientY:y})) } finally { replaying=false } },300);
  },true);
})();

function startSession(mode, pool){
  ui.hist=[];
  const all=shuffle(pool); const size=S.settings.size;
  ui.sess={mode, all, size, sec:0, i:0, flipped:false, picked:null, opts:null, typed:'', judged:null, right:0, wrong:0, done:false, missed:[], playing:mode==='auto', phase:0};
  ui.view='run';
  prepItem(); render();
  if(mode==='auto') autoStep(true);
}
const secItems = s => s.all.slice(s.sec*s.size,(s.sec+1)*s.size);
const secCount = s => Math.ceil(s.all.length/s.size);
const cur = () => {const s=ui.sess; return secItems(s)[s.i]};
function prepItem(){
  const s=ui.sess; s.flipped=false; s.picked=null; s.judged=null; s.typed=''; s.phase=0;
  if(s.mode==='choice'){
    const w=cur(); const key=S.settings.dir==='w2m'?'m':'w';
    const others=shuffle(allWords().filter(x=>x.id!==w.id&&x[key]!==w[key]));
    const seen=new Set([w[key]]); const picks=[];
    for(const o of others){if(!seen.has(o[key])){seen.add(o[key]); picks.push(o)} if(picks.length===3) break}
    s.opts=shuffle([w,...picks]);
  }
}
function advance(){
  const s=ui.sess; tick();
  if(s.i < secItems(s).length-1){s.i++; prepItem()} else {s.done=true; stopAuto()}
  render();
  if(s.mode==='auto'&&!s.done&&s.playing) autoStep(true);
}
function setLv(w,lv){w.lv=lv; save()}

function frontBack(w){
  const d=ui.sess.mode==='dict'?'m2w':S.settings.dir;
  return d==='w2m'?{front:w.w,frontEn:true,back:w.m,backEn:false}:{front:w.m,frontEn:false,back:w.w,backEn:true};

function starBtn(w){return `<button class="star-btn corner ${w.star?'on':''}" data-act="star" data-arg="${w.id}" aria-label="\ubcc4\ud45c">${w.star?I.starOn:I.star}</button>`}
function extra(w){return `${w.p?`<div class="ipa">[${esc(w.p)}]</div>`:''}${w.pos?`<div><span class="pos">${esc(w.pos)}</span></div>`:''}${w.memo?`<div class="memo">${esc(w.memo)}</div>`:''}`}

function viewRun(){
  const s=ui.sess;
  if(s.done) return viewResult();
  const items=secItems(s), w=items[s.i], fb=frontBack(w);
  const pct=(s.i+(s.mode==='flash'?0:0))/items.length*100;
  const secLbl=secCount(s)>1?`<div class="muted small" style="text-align:center;margin:-8px 0 12px">\uad6c\uac04 ${s.sec+1} / ${secCount(s)}</div>`:'';
  const head=`<div class="topbar"><button class="icon-btn" data-act="quit" aria-label="\uadf8\ub9cc\ud558\uae30">${I.x}</button><h1 style="font-variant-numeric:tabular-nums">${s.i+1}/${items.length}</h1><span></span></div>
    <div class="prog"><i style="width:${pct}%"></i></div>${secLbl}`;

      <div class="big ${fb.frontEn?'':'ko'}">${esc(fb.front)}</div>
      ${s.flipped?`<div class="back"><div class="mean ${fb.backEn?'en':''}">${esc(fb.back)}</div>${extra(w)}</div>`:`<div class="hint">\uce74\ub4dc\ub97c \ub204\ub974\uba74 ${fb.frontEn?'\ub73b':'\ub2e8\uc5b4'}\uc774 \ubcf4\uc5ec\uc694</div>`}
      ${speakBtn(w)}</div>
      <div class="answer-row"><button class="no" data-act="fl" data-arg="0">\uc544\uc9c1 \uc678\uc6b0\uace0 \uc788\uc5b4\uc694</button><button class="yes" data-act="fl" data-arg="1">\uc678\uc6e0\uc5b4\uc694</button></div>`;
  } else if(s.mode==='choice'){
    const key=S.settings.dir==='w2m'?'m':'w';
    body=`<div class="card small-card">${starBtn(w)}<div class="big ${fb.frontEn?'':'ko'}">${esc(fb.front)}</div>${s.picked?extra(w):''}${speakBtn(w)}</div>
      <div class="opts">${s.opts.map(o=>{
        let cls=''; if(s.picked){ if(o.id===w.id) cls='right'; else if(o.id===s.picked) cls='wrong'; }
        return `<button class="opt ${key==='w'?'en':''} ${cls}" data-act="pick" data-arg="${o.id}" ${s.picked?'aria-disabled="true"':''}>${esc(o[key])}</button>`}).join('')}</div>
      ${s.picked?`<button class="btn" style="margin-top:14px" data-act="next">\ub2e4\uc74c</button>`:''}`;
  } else if(s.mode==='dict'){
    body=`<div class="card small-card">${starBtn(w)}<div class="big ko">${esc(w.m)}</div>${w.pos?`<div><span class="pos">${esc(w.pos)}</span></div>`:''}<div class="muted small">${w.w.split(' ').length>1?`${w.w.split(' ').length}\ub2e8\uc5b4 \ud45c\ud604`:`${w.w.length}\uae00\uc790`} \u00b7 \uc18c\ub9ac\ub97c \ub4e4\uc5b4\ub3c4 \ub3fc\uc694</div>${speakBtn(w)}</div>
      <input id="dictIn" class="dict-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="\uc601\uc5b4\ub85c \uc4f0\uc138\uc694" value="${esc(s.typed)}" ${s.judged?'readonly':''}>
      ${s.judged?`<div class="feedback ${s.judged==='ok'?'ok':'ng'}">${s.judged==='ok'?'\uc815\ub2f5\uc774\uc5d0\uc694!':'\uc544\uc26c\uc6cc\uc694. \uc815\ub2f5\uc740'}${s.judged==='ok'?'':`<span class="correct">${esc(w.w)}</span>`}</div>
        <button class="btn" style="margin-top:14px" data-act="next">\ub2e4\uc74c</button>`
      :`<div class="btn-row" style="margin-top:12px"><button class="btn ghost" data-act="dictskip">\ubaa8\ub974\uaca0\uc5b4\uc694</button><button class="btn" data-act="dictcheck">\ud655\uc778</button></div>`}`;
  } else if(s.mode==='auto'){
    body=`<div class="card">${starBtn(w)}<div class="big ${fb.frontEn?'':'ko'}">${esc(fb.front)}</div>
      ${s.phase>=1?`<div class="back"><div class="mean ${fb.backEn?'en':''}">${esc(fb.back)}</div>${extra(w)}</div>`:''}${speakBtn(w)}</div>
      <div class="auto-ctl"><button data-act="aprev" aria-label="\uc774\uc804">${I.prev}</button><button class="main" data-act="atoggle" aria-label="${s.playing?'\uc77c\uc2dc\uc815\uc9c0':'\uc7ac\uc0dd'}">${s.playing?I.pause:I.play}</button><button data-act="anext" aria-label="\ub2e4\uc74c">${I.next}</button></div>`;
  }
  return head+body;
}

// ---------- autoplay ----------
function stopAuto(){clearTimeout(autoTimer); autoTimer=null; if(CAN_SPEAK) try{speechSynthesis.cancel()}catch(e){}}
function autoStep(fresh){
  const s=ui.sess; if(!s||s.mode!=='auto'||!s.playing||s.done) return;
  clearTimeout(autoTimer);
  const mul={slow:1.5,normal:1,fast:0.65}[S.settings.pace]||1;
  const w=cur();
  if(s.phase===0){
    if(fresh) speak(w.w);
    autoTimer=setTimeout(()=>{s.phase=1; render(); autoStep(false)},2000*mul);
  } else {
    autoTimer=setTimeout(()=>advance(),2400*mul);
  }
}

async function runOCR(files){
  const list=[...files].slice(0,maxImgs()); if(!list.length) return;
  const ctl=new AbortController();
  ui.photo={step:'loading',ctl}; render();
  const t0=Date.now(); let timedOut=false;
  const tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000); const el=document.getElementById('ocrSec'); if(el) el.textContent=s;
    if(s>=150&&!useSample()){timedOut=true; ctl.abort()}},1000);
  try{
    const r=useSample()?await SAMPLE.json(OCR_PROMPT,{images:list,signal:ctl.signal}):await apiOCR(list,ctl.signal);
    const words=(Array.isArray(r)?r:r?.words||[]).filter(x=>x&&x.w&&x.m);
    if(!words.length){ui.photo={step:'error',err:'\uc0ac\uc9c4\uc5d0\uc11c \ub2e8\uc5b4\ub97c \ucc3e\uc9c0 \ubabb\ud588\uc5b4\uc694. \ud398\uc774\uc9c0\uac00 \uc798 \ubcf4\uc774\uac8c \ub2e4\uc2dc \ucc0d\uc5b4 \uc8fc\uc138\uc694.'}}
    else ui.photo={step:'review',title:String(r?.title||'').trim()||('\uc0c8 \ub2e8\uc5b4\uc7a5 '+(S.groups.length+1)),rows:words.map(x=>({w:String(x.w),m:String(x.m),p:String(x.p||'').replace(/^\[|\]$/g,''),pos:String(x.pos||''),on:true}))};
  }catch(e){
    const code=e&&e.code;
    if(timedOut) ui.photo={step:'error',err:'2\ubd84 \ub118\uac8c \ub2f5\uc774 \uc5c6\uc5b4\uc11c \uba48\ucdc4\uc5b4\uc694. \ud398\uc774\uc9c0\ub97c \ubc18\uc529 \ub098\ub220 \ub450 \uc7a5\uc73c\ub85c \ucc0d\uc5b4\uc11c \ub2e4\uc2dc \ud574 \ubcf4\uc138\uc694.'};
    else if(code==='cancelled'||(e&&e.name==='AbortError')) ui.photo={step:'pick'};
    else if(code==='api') ui.photo={step:'error',err:
      e.status===429?'\ubb34\ub8cc \uc0ac\uc6a9\ub7c9\uc744 \uc7a0\uc2dc \ub118\uc5c8\uc5b4\uc694. 1~2\ubd84 \ub4a4\uc5d0 \ub2e4\uc2dc \uc2dc\ub3c4\ud574 \uc8fc\uc138\uc694.'
      :[400,401,403].includes(e.status)?'AI \ud0a4\uac00 \ub9de\uc9c0 \uc54a\uc544\uc694. \uc124\uc815 \ud0ed\uc5d0\uc11c \ud0a4\ub97c \ub2e4\uc2dc \ud655\uc778\ud574 \uc8fc\uc138\uc694.'
      :[500,503,504].includes(e.status)?'Google AI \uc11c\ubc84\uac00 \uc9c0\uae08 \ub9ce\uc774 \ubd90\ubcbc\uc694. \ub2e4\ub978 \ubaa8\ub378\ub85c\ub3c4 \uc2dc\ub3c4\ud588\uc9c0\ub9cc \uc548 \ub410\uc5b4\uc694. 1~2\ubd84 \ub4a4\uc5d0 \ub2e4\uc2dc \ud574 \uc8fc\uc138\uc694.'
      :'AI \uc11c\ubc84\uc5d0\uc11c \ubb38\uc81c\uac00 \uc0dd\uacbc\uc5b4\uc694('+e.status+'). \uc7a0\uc2dc \ub4a4\uc5d0 \ub2e4\uc2dc \uc2dc\ub3c4\ud574 \uc8fc\uc138\uc694.'};
    else if(e instanceof TypeError) ui.photo={step:'error',err:'\uc778\ud130\ub137 \uc5f0\uacb0\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.'};
    else ui.photo={step:'error',err:({
      not_granted:'Claude \uc0ac\uc6a9\uc744 \ud5c8\uc6a9\ud574\uc57c \uc0ac\uc9c4\uc744 \uc77d\uc744 \uc218 \uc788\uc5b4\uc694. \uc9c1\uc811 \uc785\ub825\uc740 \uadf8\ub300\ub85c \uc4f8 \uc218 \uc788\uc5b4\uc694.',
      sampling_disabled:'\uc774 \uacc4\uc815\uc5d0\uc11c\ub294 \uc0ac\uc9c4 \uc77d\uae30\ub97c \uc4f8 \uc218 \uc5c6\uc5b4\uc694. \uc9c1\uc811 \uc785\ub825\uc744 \uc774\uc6a9\ud574 \uc8fc\uc138\uc694.',
      image_rejected:'\uc774 \uc0ac\uc9c4\uc740 \uc77d\uc744 \uc218 \uc5c6\uc5b4\uc694. JPG\ub098 PNG \uc0ac\uc9c4\uc73c\ub85c \ub2e4\uc2dc \uc62c\ub824 \uc8fc\uc138\uc694.',
      rate_limited:'\uc694\uccad\uc774 \ub9ce\uc544\uc694. \uc7a0\uc2dc \ub4a4\uc5d0 \ub2e4\uc2dc \uc2dc\ub3c4\ud574 \uc8fc\uc138\uc694.',
      session_expired:'\ub2e4\uc2dc \ub85c\uadf8\uc778\ud55c \ub4a4 \uc2dc\ub3c4\ud574 \uc8fc\uc138\uc694.',
      invalid_json:'\ub2e8\uc5b4 \ubaa9\ub85d\uc744 \ub9cc\ub4e4\uc9c0 \ubabb\ud588\uc5b4\uc694. \ub2e4\uc2dc \uc2dc\ub3c4\ud558\uac70\ub098 \ub354 \ubc18\ub4ef\ud558\uac8c \ucc0d\uc5b4 \uc8fc\uc138\uc694.',
      empty_completion:'\uc0ac\uc9c4\uc5d0\uc11c \ub2e8\uc5b4\ub97c \ucc3e\uc9c0 \ubabb\ud588\uc5b4\uc694. \ub2e4\uc2dc \ucc0d\uc5b4 \uc8fc\uc138\uc694.'
    })[code]||'\uc0ac\uc9c4\uc744 \uc77d\ub2e4\uac00 \ubb38\uc81c\uac00 \uc0dd\uacbc\uc5b4\uc694. \ub2e4\uc2dc \uc2dc\ub3c4\ud574 \uc8fc\uc138\uc694.'};
  }
  clearInterval(tick);
  render();
}

function render(){
  const app=$('#app');
  const scrollKeep = ui.sheet ? (document.querySelector('.sheet')?.scrollTop||0) : null;
  let html;
  if(ui.view==='run') html=viewRun();
  else if(ui.view==='setup') html=viewSetup();
  else if(ui.view==='group') html=viewGroup();
  else html = ui.tab==='words'?viewWords(): ui.tab==='settings'?viewSettings():viewStudy();
  app.className = ui.view==='run'?'run':'';
  app.innerHTML = html + (ui.view?'':tabbar()) + sheetHtml();
  if(scrollKeep!=null){const sh=document.querySelector('.sheet'); if(sh) sh.scrollTop=scrollKeep}
  if(ui.view==='run'&&ui.sess?.mode==='dict'&&!ui.sess.judged&&!ui.sess.done){const i=$('#dictIn'); if(i) i.focus({preventScroll:true})}
}

const A = {

    s.typed=v; const norm=x=>x.toLowerCase().replace(/[\u2019']/g,"'").replace(/[.,!?~]/g,'').replace(/\s+/g,' ').trim();
    if(norm(v)===norm(w.w)){s.judged='ok'; s.right++; if(w.lv==='hard') setLv(w,'unsure')} else {s.judged='ng'; s.wrong++; s.missed.push(w); setLv(w,'hard')} speak(w.w)},
  dictskip(){const s=ui.sess, w=cur(); s.typed=$('#dictIn')?.value||''; s.judged='ng'; s.wrong++; s.missed.push(w); setLv(w,'hard'); speak(w.w)},

  retrymissed(){const m=[...new Map(ui.sess.missed.map(w=>[w.id,w])).values()]; const mode=ui.sess.mode; stopAuto(); startSession(mode,m); return false},

  closesheet(){if(ui.photo?.ctl) ui.photo.ctl.abort(); ui.sheet=null; ui.confirm=null},

  saveword(){

    const have=new Set(g.words.map(w=>w.w.toLowerCase())); let n=0;
    rows.forEach(r=>{if(!have.has(r.w.trim().toLowerCase())){g.words.push(mkWord(r.w,r.m,r.p,r.pos)); n++}});
    save(); ui.sheet=null; ui.photo=null; ui.tab='words'; ui.view='group'; ui.groupId=g.id; toast(`${name}\uc5d0 ${n}\uac1c \uc800\uc7a5\ud588\uc5b4\uc694`);
  },
  backup(){
    const txt=JSON.stringify(S); const box=$('#backupBox');
    const done=()=>toast('\ubc31\uc5c5 \ucf54\ub4dc\ub97c \ubcf5\uc0ac\ud588\uc5b4\uc694. \uba54\ubaa8 \uc571 \ub4f1\uc5d0 \ubd99\uc5ec\ub123\uc5b4 \ub450\uc138\uc694.');
    try{navigator.clipboard.writeText(txt).then(done,()=>{box.value=txt; box.select(); toast('\uc544\ub798 \uce78\uc758 \ucf54\ub4dc\ub97c \uae38\uac8c \ub20c\ub7ec \ubcf5\uc0ac\ud558\uc138\uc694')})}catch(e){box.value=txt; box.select(); toast('\uc544\ub798 \uce78\uc758 \ucf54\ub4dc\ub97c \uae38\uac8c \ub20c\ub7ec \ubcf5\uc0ac\ud558\uc138\uc694')}
    return false;
  },
  restore(){
    try{const d=JSON.parse($('#backupBox').value); if(!d||!Array.isArray(d.groups)) throw 0; d.settings={...seed().settings,...(d.settings||{})}; d.log=d.log||{}; S=d; save(); toast('\ubc31\uc5c5\uc744 \ubd88\ub7ec\uc654\uc5b4\uc694')}
    catch(e){toast('\ubc31\uc5c5 \ucf54\ub4dc\uac00 \uc62c\ubc14\ub974\uc9c0 \uc54a\uc544\uc694. \uc804\uccb4\ub97c \ubd99\uc5ec\ub123\uc5c8\ub294\uc9c0 \ud655\uc778\ud574 \uc8fc\uc138\uc694.'); return false}
  },
  gosettings(){ui.photo=null; ui.sheet='key'},
  saveocr(a){const c=ocrCfg(); c.provider=$('#ocrProv').value; const k=$('#ocrKey').value.trim(); if(k) c.key=k; if(!c.key){toast('\ud0a4\ub97c \ubd99\uc5ec\ub123\uc5b4 \uc8fc\uc138\uc694'); return false} saveOcrCfg(c); if(a==='sheet') ui.sheet=null; toast('\uc800\uc7a5\ud588\uc5b4\uc694. \uc774\uc81c \uc0ac\uc9c4\uc73c\ub85c \ub2e8\uc5b4\ub97c \ucd94\uac00\ud560 \uc218 \uc788\uc5b4\uc694.')},
  skipkey(){const c=ocrCfg(); c.skipped=true; saveOcrCfg(c); ui.sheet=null},
  clearocr(){saveOcrCfg({provider:ocrCfg().provider,key:''}); toast('\ud0a4\ub97c \uc9c0\uc6e0\uc5b4\uc694')},
  reset(){if(ui.confirm!=='reset'){ui.confirm='reset'; return} S=seed(); save(); ui.confirm=null; toast('\ucd08\uae30\ud654\ud588\uc5b4\uc694')}
};
function targetGroup(){
  const sel=$('#fGroup').value;
  if(sel==='__new'){const n=($('#fNewGroup')?.value||'').trim(); if(!n){toast('\uc0c8 \uadf8\ub8f9 \uc774\ub984\uc744 \uc785\ub825\ud574 \uc8fc\uc138\uc694'); return null} const g={id:uid(),name:n,words:[]}; S.groups.push(g); return g}
  return findGroup(sel);
}
function readReview(){const p=ui.photo; if(!p?.rows) return; const t=$('#pTitle'); if(t) p.title=t.value; p.rows.forEach((r,i)=>{const w=$('#rvW'+i); if(w){r.w=w.value; r.m=$('#rvM'+i).value; r.p=$('#rvP'+i).value}})}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  if(act==='scrim'&&e.target!==el) return;            // clicks inside the sheet
  if(act==='scrim'){A.closesheet(); render(); return}
  if(act==='flip'&&e.target.closest('button')) return;
  if(act==='rvtoggle'){e.preventDefault()}
  e.stopPropagation();
  const f=A[act]; if(!f) return;
  if(ui.view==='run'&&SNAP_ACTS.has(act)&&!(act==='pick'&&ui.sess?.picked)) snap();
  if(!['delgroup','delword','reset'].includes(act)) ui.confirm=null;
  const r=f(el.dataset.arg); if(r!==false) render();
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='dictIn'&&e.key==='Enter'){e.preventDefault(); if(!ui.sess.judged&&!e.target.value.trim()){A.dictcheck(); return} snap(); if(ui.sess.judged) A.next(); else {A.dictcheck(); render()}}
  else if(e.key==='Enter'&&e.target.dataset?.act==='flip'){snap(); A.flip(); render()}
  else if(e.target.id==='fW'&&e.key==='Enter'){e.preventDefault(); $('#fM').focus()}
  else if(e.target.id==='fM'&&e.key==='Enter'&&ui.sheet==='add'){e.preventDefault(); A.saveword()}
});
document.addEventListener('change',e=>{
  const id=e.target.id, v=e.target.value;
  if(id==='photoIn'){runOCR(e.target.files); return}
  if(id==='setGroup'){S.settings.group=v; save(); render()}
  if(id==='setSize'){S.settings.size=+v; save()}
  if(id==='setGoal'){S.settings.goal=+v; save()}
  if(id==='setRate'){S.settings.rate=+v; save(); speak('Hello')}
  if(id==='grpName'){const g=findGroup(ui.groupId); if(g&&v.trim()){g.name=v.trim(); save(); render()}}
});

render();
</script>
