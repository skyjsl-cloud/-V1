<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>강수 레이더 · Gangwon Radar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f1a;
    --panel:#0f1726ee;
    --panel-solid:#101a2b;
    --line:#22314a;
    --ink:#eaf1fb;
    --ink-dim:#8ea0bd;
    --cyan:#2fd9c7;
    --cyan-dim:#1a7f77;
    --amber:#ffb24d;
    --red:#ff5d5d;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;
  }
  #map{
    position:absolute; inset:0; z-index:0;
  }
  .leaflet-tile-pane{ filter: none; }
  .leaflet-pane.leaflet-basePane-pane{ transition: filter 0.25s ease; }
  .leaflet-pane.leaflet-basePane-pane.dark-mode{
    filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.9) saturate(0.7);
  }

  /* ---- top readout bar ---- */
  #topbar{
    position:absolute; top:14px; left:14px; right:14px; z-index:500;
    display:flex; flex-direction:column; gap:8px;
    pointer-events:none;
  }
  #topbarRow{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
  }
  #clock{
    pointer-events:auto;
    background:var(--panel);
    backdrop-filter: blur(10px);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 18px;
    display:flex; flex-direction:column; gap:2px;
  }
  #clock .date{
    font-family:'JetBrains Mono',monospace;
    font-weight:700; font-size:20px; letter-spacing:0.5px;
    color:var(--ink);
  }
  #clock .date .frame-tag{
    color:var(--cyan); font-weight:600; margin-left:8px; font-size:13px;
    border:1px solid var(--cyan-dim); padding:1px 7px; border-radius:6px;
  }
  #clock .sub{
    font-size:11px; color:var(--ink-dim); font-family:'JetBrains Mono',monospace;
  }

  #status{
    pointer-events:auto;
    background:var(--panel);
    backdrop-filter: blur(10px);
    border:1px solid var(--line);
    border-radius:14px;
    padding:8px 14px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--ink-dim);
    display:flex; align-items:center; gap:8px;
  }
  #status .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  #searchBox{
    pointer-events:auto;
    position:relative;
    background:var(--panel);
    backdrop-filter: blur(10px);
    border:1px solid var(--line);
    border-radius:12px;
    padding:9px 12px;
    display:flex; align-items:center; gap:8px;
    color:var(--ink-dim);
  }
  #searchInput{
    flex:1; background:transparent; border:none; outline:none;
    color:var(--ink); font-family:'Inter',sans-serif; font-size:14px;
  }
  #searchInput::placeholder{ color:var(--ink-dim); }
  #searchResults{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:var(--panel-solid); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; display:none; max-height:220px; overflow-y:auto;
    box-shadow:0 12px 24px rgba(0,0,0,0.4);
  }
  #searchResults.show{ display:block; }
  #searchResults .item{
    padding:10px 12px; font-size:13px; color:var(--ink);
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  #searchResults .item:last-child{ border-bottom:none; }
  #searchResults .item:hover{ background:#182742; }
  #searchResults .item .sub{ font-size:11px; color:var(--ink-dim); margin-top:2px; }
  #searchResults .empty{ padding:10px 12px; font-size:12px; color:var(--ink-dim); }

  #modeSwitch{
    pointer-events:auto;
    display:flex; gap:0; align-self:flex-start;
    background:var(--panel); backdrop-filter: blur(10px);
    border:1px solid var(--line); border-radius:12px; overflow:hidden;
  }
  #modeSwitch button{
    background:transparent; border:none; color:var(--ink-dim);
    padding:9px 14px; font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
    cursor:pointer; white-space:nowrap;
  }
  #modeSwitch button.active{ background:var(--cyan); color:#04211d; }

  #officialFrame{
    position:absolute; inset:0; z-index:100; display:none;
    flex-direction:column; background:var(--bg);
  }
  #officialFrame.show{ display:flex; }
  #officialFrame iframe{ flex:1; width:100%; border:none; }
  #officialFallback{
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:24px; text-align:center; flex:1;
  }
  #officialFallback.show{ display:flex; }
  #officialFallback a{
    background:var(--cyan); color:#04211d; text-decoration:none;
    font-weight:700; padding:12px 22px; border-radius:12px; font-size:14px;
  }
  #officialFallback p{ color:var(--ink-dim); font-size:13px; line-height:1.6; max-width:320px; }

  body.official-mode #clock,
  body.official-mode #status,
  body.official-mode #searchBox,
  body.official-mode #legend,
  body.official-mode #dock,
  body.official-mode #debugPanel{ display:none !important; }

  /* ---- legend ---- */
  #legend{
    position:absolute; left:14px; bottom:130px; z-index:500;
    background:var(--panel);
    backdrop-filter: blur(10px);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 10px 10px;
    display:flex; flex-direction:column; align-items:center;
    gap:6px;
  }
  #legend .title{ font-size:10px; color:var(--ink-dim); letter-spacing:1px; text-transform:uppercase; }
  #legend .bar{
    width:16px; height:150px; border-radius:8px;
    background: linear-gradient(to top,
      #3a2a5c 0%, #6a3fa0 6%, #9b3fd6 12%,
      #2244cc 20%, #2288ee 28%,
      #22b6a8 36%, #2fd96b 45%,
      #a8e02a 54%, #f5e02a 63%,
      #f5a623 72%, #f26b2a 80%,
      #e8362a 88%, #b3241f 96%, #7a1414 100%);
    border:1px solid var(--line);
  }
  #legend .scale{
    font-family:'JetBrains Mono',monospace;
    font-size:9px; color:var(--ink-dim);
    display:flex; flex-direction:column; justify-content:space-between;
    height:150px; text-align:right;
  }
  #legend .unit{ font-size:9px; color:var(--cyan); font-weight:600; margin-top:2px; }
  #legend .wrap{ display:flex; gap:6px; align-items:stretch; }

  /* ---- control dock ---- */
  #dock{
    position:absolute; left:50%; bottom:20px; transform:translateX(-50%);
    z-index:500;
    background:var(--panel);
    backdrop-filter: blur(12px);
    border:1px solid var(--line);
    border-radius:18px;
    padding:10px 16px 12px;
    display:flex; flex-direction:column; gap:8px;
    min-width:320px;
    box-shadow:0 12px 30px rgba(0,0,0,0.45);
  }
  #scrubber{
    -webkit-appearance:none; appearance:none;
    width:100%; height:26px; background:transparent; cursor:pointer;
    margin:0;
  }
  #scrubber::-webkit-slider-runnable-track{
    height:4px; border-radius:2px;
    background: linear-gradient(to right, var(--cyan) var(--fill,0%), #223047 0%);
  }
  #scrubber::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:16px; height:16px; border-radius:50%;
    background:var(--cyan); border:3px solid #0a0f1a;
    margin-top:-6px;
    box-shadow:0 0 10px rgba(47,217,199,0.7);
  }
  #scrubber::-moz-range-track{
    height:4px; border-radius:2px; background:#223047;
  }
  #scrubber::-moz-range-progress{
    height:4px; border-radius:2px; background:var(--cyan);
  }
  #scrubber::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%;
    background:var(--cyan); border:3px solid #0a0f1a;
  }

  #controls-row{
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .ctl-btn{
    background:#152238; border:1px solid var(--line); color:var(--ink);
    width:42px; height:42px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background 0.15s, transform 0.1s;
    user-select:none;
  }
  .ctl-btn:hover{ background:#1c2c47; }
  .ctl-btn:active{ transform:scale(0.94); }
  .ctl-btn.primary{
    width:52px; height:52px; border-radius:50%;
    background:var(--cyan); color:#04211d; border:none;
  }
  .ctl-btn.primary:hover{ background:#4fe6d5; }
  .ctl-btn svg{ width:18px; height:18px; }
  .ctl-btn.primary svg{ width:20px; height:20px; }

  #opts-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:14px; font-size:11px; color:var(--ink-dim);
    font-family:'JetBrains Mono',monospace;
    padding-top:2px; border-top:1px solid var(--line);
    margin-top:2px;
  }
  #opts-row label{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  #opacityRange{ width:70px; accent-color:var(--cyan); }
  .toggle-pill{
    display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;
  }
  .toggle-pill button{
    background:#101a2b; color:var(--ink-dim); border:none; padding:4px 9px;
    font-family:'JetBrains Mono',monospace; font-size:10px; cursor:pointer;
  }
  .toggle-pill button.active{ background:var(--cyan); color:#04211d; font-weight:700; }

  /* ---- locate button ---- */
  #locateBtn{
    position:absolute; right:14px; bottom:130px; z-index:500;
    background:var(--panel); border:1px solid var(--line);
    width:44px; height:44px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    color:var(--cyan); cursor:pointer;
  }
  #locateBtn:hover{ background:#152238; }

  #loading{
    position:absolute; inset:0; z-index:1000;
    background:var(--bg); display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px;
    transition:opacity 0.4s ease;
  }
  #loading .spinner{
    width:36px; height:36px; border-radius:50%;
    border:3px solid #1c2c47; border-top-color:var(--cyan);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading .label{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim); letter-spacing:1px; }

  #debugToggle{
    display:none;
    position:absolute; right:14px; bottom:80px; z-index:600;
    background:var(--red); color:#2a0505;
    width:36px; height:36px; border-radius:10px;
    align-items:center; justify-content:center; font-weight:800; font-size:13px;
    cursor:pointer; box-shadow:0 4px 14px rgba(255,93,93,0.4);
  }
  #debugPanel{
    display:none;
    position:absolute; right:14px; bottom:122px; z-index:600;
    width:min(320px, calc(100vw - 28px)); max-height:220px; overflow-y:auto;
    background:#180a0a; border:1px solid #5a1f1f; border-radius:12px;
    padding:10px; font-family:'JetBrains Mono',monospace; font-size:10.5px;
    color:#ffb4b4; line-height:1.5;
  }
  #debugPanel .entry{ border-bottom:1px solid #3a1414; padding:5px 0; word-break:break-all; }
  #debugPanel .entry:last-child{ border-bottom:none; }
    background:rgba(10,15,26,0.7) !important; color:var(--ink-dim) !important;
    font-size:9px !important;
  }
  .leaflet-control-attribution a{ color:var(--cyan) !important; }

  @media (max-width:480px){
    #clock .date{ font-size:16px; }
    #dock{ min-width:260px; padding:8px 10px 10px; }
    #legend{ bottom:150px; padding:8px 7px 8px; }
    #legend .bar,#legend .scale{ height:110px; }
    #locateBtn{ bottom:150px; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="label">RADAR DATA LOADING…</div>
</div>

<div id="map"></div>

<div id="officialFrame" class="show">
  <iframe id="kmaIframe" src="https://www.weather.go.kr/w/weather/radar/radar.do" title="기상청 레이더" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div id="officialFallback">
    <p>이 브라우저 설정에서는 기상청 페이지를 화면 안에 직접 표시할 수 없습니다. 아래 버튼으로 새 창에서 열어주세요.</p>
    <a href="https://www.weather.go.kr/w/weather/radar/radar.do" target="_blank" rel="noopener">기상청 레이더 새 창에서 열기 ↗</a>
  </div>
</div>

<div id="topbar">
  <div id="topbarRow">
    <div id="clock">
      <div class="date"><span id="dateText">--</span><span class="frame-tag" id="frameTag">LIVE</span></div>
      <div class="sub" id="subText">대한민국 강수 레이더 · 내 위치 기반</div>
    </div>
    <div id="status">
      <div class="dot"></div>
      <span id="statusText">RainViewer 연결됨</span>
    </div>
  </div>
  <div id="searchBox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
    <input type="text" id="searchInput" placeholder="지역/지명 검색 (예: 춘천, 철원)">
    <div id="searchResults"></div>
  </div>
  <div id="modeSwitch">
    <button id="modeCustom">커스텀 지도</button>
    <button id="modeOfficial" class="active">기상청 공식</button>
  </div>
</div>

<div id="legend">
  <div class="title">mm/h</div>
  <div class="wrap">
    <div class="bar"></div>
    <div class="scale">
      <span>100+</span><span>50</span><span>25</span><span>10</span><span>5</span><span>1</span><span>0.1</span>
    </div>
  </div>
</div>

<div id="locateBtn" title="내 위치로 이동">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
  </svg>
</div>

<div id="debugToggle" title="오류 로그">!</div>
<div id="debugPanel"></div>

<div id="dock">
  <input type="range" id="scrubber" min="0" max="0" value="0" step="1">
  <div id="controls-row">
    <div class="ctl-btn" id="prevBtn" title="이전 프레임">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </div>
    <div class="ctl-btn primary" id="playBtn" title="재생/정지">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="ctl-btn" id="nextBtn" title="다음 프레임">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
    </div>
    <div class="ctl-btn" id="refreshBtn" title="새로고침">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 4v6h-6"/></svg>
    </div>
  </div>
  <div id="opts-row">
    <label><input type="checkbox" id="futureToggle" style="accent-color:var(--cyan);"> 예측(30분)</label>
    <label>투명도 <input type="range" id="opacityRange" min="20" max="100" value="75"></label>
    <div class="toggle-pill">
      <button id="baseDark">Dark</button>
      <button id="baseLight" class="active">Light</button>
    </div>
    <a href="https://www.weather.go.kr/w/weather/radar/radar.do" target="_blank" rel="noopener" style="color:var(--ink-dim); text-decoration:underline; font-size:11px; font-family:'JetBrains Mono',monospace;">기상청 레이더 ↗</a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  "use strict";

  // ---- 화면 내 디버그 로그 (모바일에서 콘솔 확인이 어려우므로) ----
  const debugToggle = document.getElementById('debugToggle');
  const debugPanel = document.getElementById('debugPanel');
  const debugLogs = [];
  function pushDebug(msg){
    debugLogs.unshift('[' + new Date().toLocaleTimeString('ko-KR') + '] ' + msg);
    if(debugLogs.length > 20) debugLogs.pop();
    debugPanel.innerHTML = debugLogs.map(m => `<div class="entry">${m}</div>`).join('');
    debugToggle.style.display = 'flex';
  }
  function pushDebugImage(url, label){
    debugToggle.style.display = 'flex';
    const wrap = document.createElement('div');
    wrap.className = 'entry';
    wrap.innerHTML = `<div>${label}</div>`;
    const img = document.createElement('img');
    img.src = url;
    img.style.cssText = 'width:96px;height:96px;border:1px solid #5a1f1f;margin-top:4px;background:#111;image-rendering:pixelated;';
    wrap.appendChild(img);
    debugPanel.prepend(wrap);
  }
  window.addEventListener('error', (e)=> pushDebug('오류: ' + e.message));
  window.addEventListener('unhandledrejection', (e)=> pushDebug('Promise 오류: ' + (e.reason && e.reason.message || e.reason)));
  const origConsoleError = console.error.bind(console);
  console.error = function(...args){ pushDebug(args.map(String).join(' ')); origConsoleError(...args); };
  debugToggle.addEventListener('click', ()=>{
    debugPanel.style.display = debugPanel.style.display === 'block' ? 'none' : 'block';
  });

  // 대한민국 전역 기본 뷰 (위치 권한 확인 전 fallback)
  const KOREA_CENTER = [36.2, 127.9];
  const KOREA_ZOOM = 7;
  const map = L.map('map', { zoomControl:false, attributionControl:true }).setView(KOREA_CENTER, KOREA_ZOOM);
  L.control.zoom({ position:'bottomright' }).addTo(map);

  // 베이스 타일 전용 pane (다크 모드 시 이 pane에만 색상 반전 필터 적용, 레이더 오버레이는 영향 없음)
  map.createPane('basePane');
  map.getPane('basePane').style.zIndex = 200;

  // 표준 OpenStreetMap 타일: 한국 지명이 한글(name 태그)로 표시됨
  const TILE_OSM = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
  let baseLayer = L.tileLayer(TILE_OSM, {
    subdomains:'abc', maxZoom:19, pane:'basePane',
    attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);
  let darkMode = false;

  let userMarker = null;
  function placeUserMarker(latlng, label){
    if(userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker(latlng, {
      radius:7, color:'#0a0f1a', weight:2, fillColor:'#2fd9c7', fillOpacity:1
    }).addTo(map).bindPopup(label);
  }

  function locateAndCenter(onDone){
    pushDebug('위치 확인 시작 · protocol=' + location.protocol + ' · geolocation지원=' + (!!navigator.geolocation));

    if(navigator.permissions && navigator.permissions.query){
      navigator.permissions.query({name:'geolocation'}).then(p=>{
        pushDebug('geolocation 권한 상태: ' + p.state);
      }).catch(()=>{});
    }

    if(!navigator.geolocation){
      pushDebug('navigator.geolocation 자체가 없음 → IP 폴백');
      ipFallbackLocate(onDone);
      return;
    }

    let settled = false;
    // enableHighAccuracy:true는 GPS 신호를 기다리다 모바일에서 타임아웃/실패가 잦아
    // false(네트워크/Wi-Fi 기반, 더 빠르고 실내에서도 잘 됨)로 우선 시도
    navigator.geolocation.getCurrentPosition((pos)=>{
      if(settled) return; settled = true;
      pushDebug('GPS 위치 성공: ' + pos.coords.latitude.toFixed(4) + ', ' + pos.coords.longitude.toFixed(4) + ' (정확도 ' + Math.round(pos.coords.accuracy) + 'm)');
      const ll = [pos.coords.latitude, pos.coords.longitude];
      map.setView(ll, 12);
      placeUserMarker(ll, '내 위치 (GPS)');
      statusText.textContent = 'RainViewer 연결됨 · GPS 위치 사용';
      onDone && onDone();
    }, (err)=>{
      if(settled) return; settled = true;
      const codeNames = {1:'PERMISSION_DENIED', 2:'POSITION_UNAVAILABLE', 3:'TIMEOUT'};
      pushDebug('GPS 위치 실패 [' + (codeNames[err.code]||err.code) + ']: ' + err.message + ' → IP 기반 위치로 대체');
      ipFallbackLocate(onDone);
    }, { timeout:7000, enableHighAccuracy:false, maximumAge:60000 });

    // 일부 모바일 브라우저는 콜백을 아예 호출하지 않고 멈추는 경우가 있어 안전장치로 강제 타임아웃 추가
    setTimeout(()=>{
      if(settled) return; settled = true;
      pushDebug('GPS 콜백 무응답(안전장치 타임아웃) → IP 기반 위치로 대체');
      ipFallbackLocate(onDone);
    }, 9000);
  }

  async function ipFallbackLocate(onDone){
    statusText.textContent = 'IP 기반 위치 확인 중…';
    pushDebug('IP 기반 위치 조회 시작 (ipapi.co)');
    try{
      const res = await fetch('https://ipapi.co/json/');
      pushDebug('IP 위치 API 응답 코드: ' + res.status);
      if(!res.ok) throw new Error('IP 위치 API 응답 코드 ' + res.status);
      const d = await res.json();
      if(!d.latitude || !d.longitude) throw new Error('IP 위치 응답에 좌표 없음: ' + JSON.stringify(d).slice(0,120));
      const ll = [d.latitude, d.longitude];
      pushDebug('IP 기반 위치 성공: ' + ll[0] + ', ' + ll[1] + ' (' + (d.city||'') + ' ' + (d.region||'') + ')');
      map.setView(ll, 11);
      const label = [d.city, d.region].filter(Boolean).join(' ') || '내 위치 (IP 기반, 대략적)';
      placeUserMarker(ll, label + ' · IP 기반 대략 위치');
      statusText.textContent = 'RainViewer 연결됨 · IP 기반 대략 위치 (' + label + ')';
    }catch(e){
      statusText.textContent = '위치 확인 실패 · 위에서 지역 검색 가능';
      pushDebug('IP 위치 폴백 실패: ' + e.message);
    }finally{
      onDone && onDone();
    }
  }

  // ---- radar state ----
  let frames = [];       // {time, path}
  let pastCount = 0;
  let currentIndex = 0;
  let radarLayer = null;
  let playing = false;
  let playTimer = null;
  let opacity = 0.75;
  let showFuture = false;

  const scrubber = document.getElementById('scrubber');
  const dateText = document.getElementById('dateText');
  const frameTag = document.getElementById('frameTag');
  const subText = document.getElementById('subText');
  const statusText = document.getElementById('statusText');
  const loading = document.getElementById('loading');

  function fmt(ts){
    const d = new Date(ts*1000);
    const days = ['일','월','화','수','목','금','토'];
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    const hh = String(d.getHours()).padStart(2,'0');
    const mi = String(d.getMinutes()).padStart(2,'0');
    return `${mm}월 ${dd}일(${days[d.getDay()]}) ${hh}:${mi}`;
  }

  function setRadarFrame(idx){
    if(!frames.length) return;
    idx = Math.max(0, Math.min(frames.length-1, idx));
    currentIndex = idx;
    const f = frames[idx];

    if(radarLayer){ map.removeLayer(radarLayer); }
    radarLayer = L.tileLayer(
      `https://tilecache.rainviewer.com${f.path}/256/{z}/{x}/{y}/6/1_1.png`,
      { opacity: opacity, zIndex: 450, tileSize:256, maxNativeZoom:7, maxZoom:19 }
    ).addTo(map);
    let tileErrCount = 0, tileLoadCount = 0;
    radarLayer.on('tileerror', (err)=>{
      tileErrCount++;
      pushDebug('레이더 타일 로드 실패: ' + (err.tile && err.tile.src || '알 수 없음'));
    });
    radarLayer.on('tileload', ()=>{ tileLoadCount++; });
    radarLayer.on('load', ()=>{
      // 타일 요청은 성공(에러 없음)했지만 강수가 전혀 없어 보이는 경우,
      // RainViewer의 한국 소스(기상청 연동) 자체가 일시적으로 비어있을 수 있음을 안내
      if(tileErrCount === 0 && tileLoadCount > 0){
        subText.textContent = '색이 안 보이면 실제로 비가 없거나, RainViewer 한국(기상청) 소스 오류일 수 있습니다.';
      }
    });

    scrubber.value = idx;
    scrubber.style.setProperty('--fill', (idx/(frames.length-1||1)*100)+'%');
    dateText.textContent = fmt(f.time);
    frameTag.textContent = idx < pastCount ? (idx === pastCount-1 ? 'LIVE' : 'PAST') : 'FCST +' + ((idx-pastCount+1)*10) + 'm';
    frameTag.style.borderColor = idx >= pastCount ? 'var(--amber)' : '';
    frameTag.style.color = idx >= pastCount ? 'var(--amber)' : '';
  }

  async function loadFrames(){
    statusText.textContent = '레이더 데이터 갱신 중…';
    try{
      const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
      if(!res.ok) throw new Error('API 응답 코드 ' + res.status);
      const data = await res.json();
      if(!data || !data.radar || !Array.isArray(data.radar.past)){
        throw new Error('API 응답 형식이 예상과 다름: ' + JSON.stringify(data).slice(0,150));
      }
      const past = data.radar.past || [];
      const future = showFuture ? (data.radar.nowcast || []) : [];
      pastCount = past.length;
      frames = [...past, ...future];
      if(!frames.length) throw new Error('사용 가능한 레이더 프레임이 없음');
      scrubber.max = frames.length - 1;
      setRadarFrame(frames.length - 1 - future.length); // land on latest observed
      // 강원도(춘천) 부근 실제 레이더 타일을 육안으로 직접 확인 (zoom6, x54,y24 근사치)
      const latestPastPath = past[past.length - 1].path;
      pushDebugImage(
        `https://tilecache.rainviewer.com${latestPastPath}/256/6/54/24/6/1_1.png`,
        '춘천 부근 원본 타일(zoom6) — 색이 보이면 데이터 있음, 완전히 비어있으면 실제로 그 시각 강수가 없거나 소스 공백'
      );
      statusText.textContent = 'RainViewer 연결됨 · ' + frames.length + '개 프레임';
      subText.textContent = '대한민국 강수 레이더 · 내 위치 기반';
    }catch(e){
      statusText.textContent = '데이터 로드 실패';
      subText.textContent = '아래 오류 배지(!)를 눌러 원인을 확인하세요.';
      dateText.textContent = '⚠ 로드 실패';
      pushDebug('loadFrames 실패: ' + e.message);
      console.error(e);
    }finally{
      loading.style.opacity = '0';
      setTimeout(()=>{ loading.style.display='none'; }, 400);
    }
  }

  // ---- playback ----
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>';

  function stepFrame(dir){
    let next = currentIndex + dir;
    if(next < 0) next = frames.length - 1;
    if(next >= frames.length) next = 0;
    setRadarFrame(next);
  }

  function play(){
    playing = true;
    playIcon.innerHTML = ICON_PAUSE;
    playTimer = setInterval(()=>{ stepFrame(1); }, 700);
  }
  function pause(){
    playing = false;
    playIcon.innerHTML = ICON_PLAY;
    clearInterval(playTimer);
  }

  playBtn.addEventListener('click', ()=> playing ? pause() : play());
  document.getElementById('prevBtn').addEventListener('click', ()=>{ pause(); stepFrame(-1); });
  document.getElementById('nextBtn').addEventListener('click', ()=>{ pause(); stepFrame(1); });
  document.getElementById('refreshBtn').addEventListener('click', ()=>{ pause(); loading.style.display='flex'; loading.style.opacity='1'; loadFrames(); });
  scrubber.addEventListener('input', (e)=>{ pause(); setRadarFrame(parseInt(e.target.value,10)); });

  document.getElementById('opacityRange').addEventListener('input', (e)=>{
    opacity = parseInt(e.target.value,10)/100;
    if(radarLayer) radarLayer.setOpacity(opacity);
  });

  document.getElementById('futureToggle').addEventListener('change', (e)=>{
    showFuture = e.target.checked;
    pause();
    loading.style.display='flex'; loading.style.opacity='1';
    loadFrames();
  });

  // ---- base map toggle ----
  const btnDark = document.getElementById('baseDark');
  const btnLight = document.getElementById('baseLight');
  const basePaneEl = map.getPane('basePane');
  btnDark.addEventListener('click', ()=>{
    darkMode = true;
    basePaneEl.classList.add('dark-mode');
    btnDark.classList.add('active'); btnLight.classList.remove('active');
  });
  btnLight.addEventListener('click', ()=>{
    darkMode = false;
    basePaneEl.classList.remove('dark-mode');
    btnLight.classList.add('active'); btnDark.classList.remove('active');
  });

  // ---- locate ----
  document.getElementById('locateBtn').addEventListener('click', ()=>{
    // 기상청 공식(iframe) 모드에서 눌러도 동작하도록 커스텀 지도로 먼저 전환
    if(document.body.classList.contains('official-mode')){
      modeCustomBtn.click();
    }
    statusText.textContent = '위치 확인 중…';
    locateAndCenter();
  });

  // keep radar layer above base but adjust when base changes
  map.on('layeradd', ()=>{ if(radarLayer) radarLayer.bringToFront(); });

  // ---- 지명 검색 (위치 권한이 막혔을 때의 대체 수단) ----
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');
  let searchTimer = null;

  async function runSearch(q){
    if(!q || q.trim().length < 2){ searchResults.classList.remove('show'); return; }
    searchResults.innerHTML = '<div class="empty">검색 중…</div>';
    searchResults.classList.add('show');
    try{
      const url = 'https://nominatim.openstreetmap.org/search?format=json&countrycodes=kr&accept-language=ko&limit=6&q=' + encodeURIComponent(q);
      const res = await fetch(url, { headers:{ 'Accept':'application/json' } });
      const data = await res.json();
      if(!data.length){
        searchResults.innerHTML = '<div class="empty">검색 결과 없음</div>';
        return;
      }
      searchResults.innerHTML = '';
      data.forEach(place=>{
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `<div>${place.display_name.split(',')[0]}</div><div class="sub">${place.display_name}</div>`;
        div.addEventListener('click', ()=>{
          const lat = parseFloat(place.lat), lon = parseFloat(place.lon);
          map.setView([lat, lon], 11);
          placeUserMarker([lat, lon], place.display_name.split(',')[0]);
          searchResults.classList.remove('show');
          searchInput.value = place.display_name.split(',')[0];
          statusText.textContent = 'RainViewer 연결됨';
        });
        searchResults.appendChild(div);
      });
    }catch(e){
      searchResults.innerHTML = '<div class="empty">검색 실패 (네트워크 확인)</div>';
    }
  }

  searchInput.addEventListener('input', (e)=>{
    clearTimeout(searchTimer);
    const q = e.target.value;
    searchTimer = setTimeout(()=> runSearch(q), 450);
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('#searchBox')) searchResults.classList.remove('show');
  });

  // ---- 모드 전환: 커스텀 지도 vs 기상청 공식(iframe) ----
  document.body.classList.add('official-mode');
  const officialFrameEl = document.getElementById('officialFrame');
  const officialFallbackEl = document.getElementById('officialFallback');
  const kmaIframe = document.getElementById('kmaIframe');
  const modeCustomBtn = document.getElementById('modeCustom');
  const modeOfficialBtn = document.getElementById('modeOfficial');

  // iframe이 X-Frame-Options 등으로 막히면 onload는 뜨지만 내용이 비어있을 수 있어,
  // 일정 시간 안에 로드 이벤트가 없으면 폴백 버튼을 노출
  let iframeLoaded = false;
  kmaIframe.addEventListener('load', ()=>{ iframeLoaded = true; });
  setTimeout(()=>{
    if(!iframeLoaded){
      officialFallbackEl.classList.add('show');
      pushDebug('기상청 페이지 iframe 로드 실패 (프레임 차단 가능성) — 새 창 버튼 사용');
    }
  }, 4000);

  modeOfficialBtn.addEventListener('click', ()=>{
    document.body.classList.add('official-mode');
    officialFrameEl.classList.add('show');
    modeOfficialBtn.classList.add('active'); modeCustomBtn.classList.remove('active');
  });
  modeCustomBtn.addEventListener('click', ()=>{
    document.body.classList.remove('official-mode');
    officialFrameEl.classList.remove('show');
    modeCustomBtn.classList.add('active'); modeOfficialBtn.classList.remove('active');
    map.invalidateSize();
  });

  loadFrames();
  locateAndCenter(); // 최초 로드 시 내 위치 기반 센터링 시도 (거부 시 대한민국 전체 뷰)
  setInterval(loadFrames, 5 * 60 * 1000); // 5분마다 최신 프레임 목록 갱신
})();
</script>
</body>
</html>
